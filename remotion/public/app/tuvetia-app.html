  <!--
  ╔══════════════════════════════════════════════════════════════════════════════════════════╗
  ║  TUVETIA · toda la aplicación en un solo archivo HTML                                     ║
  ║  Mapeo del repo plogy-dev/tuvetia en el commit 979c12f (31-ago-2026).                     ║

  ESTA VARIANTE — REDISEÑO FULL (2-sep-2026)
  ------------------------------------------
  Clon de tuvetia-app-actual.html con el VIBE de TUVETIA-PROD aplicado encima, conservando
  la paleta blanco + menta. Lo que cambia es la capa de estilo (S01-S16), no el
  comportamiento: mismas rutas, mismas acciones, mismos datos. Fuente del vibe: la maqueta
  CRM del 19-ago (docs/mockups/crm-maqueta.html en TUVETIA-PROD) y las pantallas
  rediseñadas de esa app. En concreto: grano de papel en el fondo, microrrótulos en mono,
  titulares display 26px, dos sombras suaves (sm/md) con hover que "levanta" las cards,
  radios un punto más apretados, barra lateral entintada con iconos siempre visibles y
  segmentos elevados en vez de rellenos de menta. Cada cambio va marcado con «REDISEÑO» en
  el CSS. Ahora hay UNA petición de red (Google Fonts); sin internet todo sigue andando.

  Segunda pasada (mismo día, pedidos de Luciano):
  · LOGOS DE MARCA REALES (registro LOGOS + logo()): Google, Microsoft, Gmail, Google
    Calendar y WhatsApp a color oficial, en Integraciones (tarjetas de producto con tile,
    insignia de estado y filete) y en los botones de acceso y estados vacíos.
  · RENOMBRE: el asistente se llama VetGPT en toda la app. «Modo Fantasma» deja de ser
    marca: la pantalla es «Consultas» (título: «Consultas con VetGPT») y el modo fantasma
    queda en minúscula como descripción de CÓMO escucha VetGPT. Identificadores en bloque
    (responderVetGPT, PanelVetGPTOnboarding, VetGPTEnVivo, VETGPT_FRASE); las clases CSS
    .vetgpt/.panel-vetgpt ya venían con ese nombre y quedan alineadas.
    (Pasada previa lo había renombrado a «Athos»; se revierte a VetGPT.)

  QUÉ ES
  ------
  Una réplica funcional de Tuvetia —sin la landing— que corre sola: se abre con doble clic,
  no pide servidor, no pide internet, no habla con ningún backend. Todos los datos son de
  mentira pero coherentes entre sí: el tablero no tiene cifras propias, las CALCULA de las
  mismas listas que pintan Pacientes, Agenda y Ventas. Por eso crear una factura mueve las
  ventas del mes, y aprobar una nota baja el contador de borradores.

  CÓMO SE ENTRA (tres caminos, los tres desde #/login)
  ---------------------------------------------------
   1. «Entrar como clínica demo»  → La Arboleda, con siete meses de historia. Es lo que hay
                                    que mirar para ver la app llena.
   2. «Empezar de cero»           → cuenta nueva → registro → wizard de bienvenida de 6 pasos
                                    → app vacía, con sus estados vacíos de verdad.
   3. «Panel de plataforma»       → el /admin de Tuvetia (el nuestro, no el de la clínica).

  Recargar la página reinicia todo: el estado vive en memoria, a propósito.

  CÓMO ESTÁ HECHO
  ---------------
  · Router por hash (#/dashboard/consultas/c-3) con guardas: sin sesión va a login; sin
    onboarding va a bienvenida; /admin sólo para el admin de plataforma. Atrás y adelante del
    navegador funcionan.
  · Cada vista es una función pura que devuelve HTML. Al navegar se repinta todo salvo
    #floating (el notch y el dock, que sobreviven a la navegación) y los overlays.
  · Un solo listener en document: data-act="loQueSea" contra el registro ACTIONS.
  · Todos los temporizadores pasan por SIM, con ámbitos: "view" se limpia al repintar;
    "chat", "rec", "dock" y "global" sobreviven.
  · Los tokens de color, radio, sombra y tipografía están copiados de src/app/globals.css tal
    cual, incluido el bloque .dark/.consulta.
  · Los gráficos son SVG a mano (dona con stroke-dasharray, barras, anillo). Los iconos son
    ~70 SVG en línea al estilo Lucide, que es lo que usa el repo.
