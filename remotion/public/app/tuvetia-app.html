      pointer-events: auto;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      max-width: 380px;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-popover);
      font-size: 13px;
      animation: subir-toast .16s var(--ease);

      from {

        transform: translateY(8px);

      height: 16px;
      flex: none;
      margin-top: 1px;

      color: var(--danger);

    .toast.warn svg {
      color: var(--warn);

      flex: none;

      font-weight: 500;
      color: var(--accent-text);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;

    :root {

    }

    }

    }

    /* ═══════════════════════════════════════════════════════════════════════════════════════════
       [J05] SELECTORES — la regla de oro del archivo.
    
       NINGUNA pantalla guarda una cifra. Todas se derivan de las listas de [J04], así que no
       pueden desincronizarse: si la demo emite una factura, el libro, la cartera, la dona de
       ventas, el anillo de cumplimiento y la pastilla de «Facturado este mes» se mueven juntos
       porque son la misma suma leída desde sitios distintos.
       ═══════════════════════════════════════════════════════════════════════════════════════════ */
    const getP = id => DB.pacientes.find(p => p.id === id) || null;
    const getO = id => DB.titulares.find(o => o.id === id) || null;
    const getU = id => DB.usuarios.find(u => u.id === id) || null;
    const getItem = id => DB.catalogo.find(i => i.id === id) || null;
    const getC = id => DB.consultas.find(c => c.id === id) || null;
    const getF = id => DB.facturas.find(f => f.id === id) || null;
    const nomP = id => getP(id)?.nombre ?? "Sin paciente";
    const nomO = id => getO(id)?.nombre ?? "Venta a persona indeterminada";
    const nomU = id => getU(id)?.nombre ?? "—";

    /* Una línea de factura: base, descuento e IVA. El descuento se aplica ANTES del IVA, que es
       como lo pide la DIAN y como lo hace el carrito del repo. */
    function montosDeLinea(l) {
      const bruto = Math.round(l.precio * l.qty);
      const desc = Math.round(bruto * (l.descPct || 0) / 100);
      const base = bruto - desc;
      const iva = Math.round(base * (l.iva || 0) / 100);
      return { bruto, desc, base, iva, total: base + iva };
    }
    const subtotalDeFactura = f => f.lineas.reduce((s, l) => s + montosDeLinea(l).base, 0);
    const ivaDeFactura = f => f.lineas.reduce((s, l) => s + montosDeLinea(l).iva, 0);
    const descuentoDeFactura = f => f.lineas.reduce((s, l) => s + montosDeLinea(l).desc, 0) + (f.descGlobal || 0);
    function totalDeFactura(f) { return Math.max(0, subtotalDeFactura(f) + ivaDeFactura(f) - (f.descGlobal || 0)); }
    const pagadoDeFactura = f => (f.pagos || []).reduce((s, p) => s + p.monto, 0);
    const saldoDeFactura = f => f.estado === "EMITIDA" ? Math.max(0, totalDeFactura(f) - pagadoDeFactura(f)) : 0;

    /* El estado de cobro que se MUESTRA no siempre es el guardado: una factura «pendiente» cuya
       fecha de vencimiento ya pasó se ve «vencida» sin que nadie la toque. */
    function estadoDeCobro(f, ahora = new Date()) {
      if (f.estado !== "EMITIDA") return "PENDIENTE";
      const saldo = saldoDeFactura(f);
      if (saldo <= 0) return "PAGADA";
      if (f.vence && aFecha(f.vence) < ahora) return "VENCIDA";
      return pagadoDeFactura(f) > 0 ? "PARCIALMENTE_PAGADA" : "PENDIENTE";
    }

    const SEL = {
      emitidas: () => DB.facturas.filter(f => f.estado === "EMITIDA"),
      delMes: (fs, campo = "emitido") => fs.filter(f => f[campo] && enMes(f[campo])),
      facturadoMes() { return this.delMes(this.emitidas()).reduce((s, f) => s + totalDeFactura(f), 0); },
      /* La comparación del tablero es «a la misma altura del mes pasado»: no el mes entero, sino
         hasta el mismo día. Si no, el día 3 siempre parecería una caída del 90%. */
      facturadoMesAnterior() {
        const d = HOY.getDate();
        const ini = new Date(HOY.getFullYear(), HOY.getMonth() - 1, 1);
        const fin = new Date(HOY.getFullYear(), HOY.getMonth() - 1, d, 23, 59, 59);
        return this.emitidas().filter(f => f.emitido && aFecha(f.emitido) >= ini && aFecha(f.emitido) <= fin)
          .reduce((s, f) => s + totalDeFactura(f), 0);
      },
      porCobrar() { return this.emitidas().reduce((s, f) => s + saldoDeFactura(f), 0); },
      carteraVencida(ahora = new Date()) {
        return this.emitidas().filter(f => saldoDeFactura(f) > 0 && f.vence && aFecha(f.vence) < ahora)
          .reduce((s, f) => s + saldoDeFactura(f), 0);
      },
      porCobrarLista() { return this.emitidas().filter(f => saldoDeFactura(f) > 0).sort((a, b) => aFecha(a.vence) - aFecha(b.vence)); },
      /* Antigüedad de cartera en las cinco celdas de la pantalla de Cartera. */
      aging(ahora = new Date()) {
        const b = { corriente: 0, d1_30: 0, d31_60: 0, d61_90: 0, d90: 0, total: 0, vencido: 0 };
        for (const f of this.porCobrarLista()) {
          const saldo = saldoDeFactura(f);
          b.total += saldo;
          const d = f.vence ? Math.floor((ahora - aFecha(f.vence)) / 864e5) : -1;
          if (d < 0) b.corriente += saldo;
          else { b.vencido += saldo; if (d <= 30) b.d1_30 += saldo; else if (d <= 60) b.d31_60 += saldo; else if (d <= 90) b.d61_90 += saldo; else b.d90 += saldo; }
        }
        return b;
      },

      consultasMes: () => DB.consultas.filter(c => enMes(c.inicio)).length,
      consultasMesAnterior() {
        const d = HOY.getDate();
        const ini = new Date(HOY.getFullYear(), HOY.getMonth() - 1, 1);
        const fin = new Date(HOY.getFullYear(), HOY.getMonth() - 1, d, 23, 59, 59);
        return DB.consultas.filter(c => aFecha(c.inicio) >= ini && aFecha(c.inicio) <= fin).length;
      },
      consultasHoy: () => DB.consultas.filter(c => esHoy(c.inicio)).length,
      citasVivas: () => DB.citas.filter(a => ["scheduled", "confirmed", "in_progress"].includes(a.estado)),
      citasProx7() { const t = Date.now(), h = t + 7 * 864e5; return this.citasVivas().filter(a => { const x = aFecha(a.inicio).getTime(); return x >= t && x <= h; }).length; },
      citasHoy() { return this.citasVivas().filter(a => esHoy(a.inicio)).length; },
      proximasCitas(n = 8) { const t = Date.now(); return this.citasVivas().filter(a => aFecha(a.inicio).getTime() >= t).sort((a, b) => aFecha(a.inicio) - aFecha(b.inicio)).slice(0, n); },
      citasDeHoy() { return this.citasVivas().filter(a => esHoy(a.inicio)).sort((a, b) => aFecha(a.inicio) - aFecha(b.inicio)); },
      notasBorrador: () => DB.notas.filter(n => n.estado === "draft"),
      vacunasPorVencer() { const lim = Date.now() + 30 * 864e5; return DB.vacunas.filter(v => v.proxima && aFecha(v.proxima).getTime() <= lim).length; },
      pacientesNuevosMes: () => DB.pacientes.filter(p => enMes(p.creado)).length,

      /* Doce semanas de consultas, que es lo que pinta el gráfico de barras. */
      serieSemanal(fechas, semanas = 12) {
        const lunes = d => { const x = new Date(d); const dia = (x.getDay() + 6) % 7; x.setDate(x.getDate() - dia); x.setHours(0, 0, 0, 0); return x; };
        const base = lunes(HOY);
        const cubos = [];
        for (let i = semanas - 1; i >= 0; i--) {
          const ini = new Date(base); ini.setDate(ini.getDate() - i * 7);
          cubos.push({ ini: ini.getTime(), rot: `${ini.getDate()} ${MESES_C[ini.getMonth()]}`, n: 0 });
        }
        for (const f of fechas) { const k = lunes(aFecha(f)).getTime(); const c = cubos.find(x => x.ini === k); if (c) c.n++; }
        return cubos;
      },
      /* La dona de ventas parte lo facturado del mes por tipo de ítem. */
      ventasPorTipo() {
        const TIPOS = [
          { tipo: "SERVICIO", rot: "Servicios", color: "var(--chart-1)" },
          { tipo: "MEDICAMENTO", rot: "Medicamentos", color: "var(--chart-2)" },
          { tipo: "PRODUCTO", rot: "Productos", color: "var(--chart-3)" },
          { tipo: "INSUMO", rot: "Insumos", color: "var(--chart-4)" },
          { tipo: "OTROS", rot: "Líneas libres", color: "var(--chart-5)" }
        ];
        const suma = new Map();
        for (const f of this.delMes(this.emitidas()))
          for (const l of f.lineas) {
            const it = getItem(l.itemId);
            const t = it ? it.tipo : "OTROS";
            suma.set(t, (suma.get(t) || 0) + montosDeLinea(l).total);
          }
        return TIPOS.filter(t => (suma.get(t.tipo) || 0) > 0).map(t => ({ ...t, valor: suma.get(t.tipo) }));
      },
      pacientesPorEspecie() {
        const G = [
          { k: "perro", rot: "Perros", color: "var(--chart-1)", alias: ["perro", "canino"] },
          { k: "gato", rot: "Gatos", color: "var(--chart-3)", alias: ["gato", "felino"] },
          { k: "conejo", rot: "Conejos", color: "var(--chart-2)", alias: ["conejo"] },
          { k: "ave", rot: "Aves", color: "var(--chart-5)", alias: ["ave", "loro", "pájaro"] }
        ];
        const cuenta = new Map(); let otras = 0;
        for (const p of DB.pacientes) {
          const n = (p.especie || "").toLowerCase();
          const g = G.find(x => x.alias.some(a => n.startsWith(a)));
          if (g) cuenta.set(g.k, (cuenta.get(g.k) || 0) + 1); else otras++;
        }
        const out = G.filter(g => cuenta.get(g.k)).map(g => ({ rot: g.rot, color: g.color, valor: cuenta.get(g.k) }));
        if (otras) out.push({ rot: "Otras especies", color: "var(--chart-4)", valor: otras });
        return out;
      },
      /* El anillo: cuánto de la meta se lleva, y si eso va EN RITMO para el día del mes. La aguja
         del ritmo es lo que convierte un porcentaje en un juicio. */
      cumplimiento() {
        const meta = DB.clinica.metaVentasCents;
        if (!meta) return null;
        const vendido = this.facturadoMes();
        const pct = Math.round(vendido / meta * 100);
        const diasDelMes = new Date(HOY.getFullYear(), HOY.getMonth() + 1, 0).getDate();
        const ritmo = Math.round(HOY.getDate() / diasDelMes * 100);
        return {
          pct, arco: Math.min(100, pct), vendido, meta, faltan: Math.max(0, meta - vendido),
          ritmo, enRitmo: pct >= ritmo, cumplida: pct >= 100,
          color: pct >= 100 ? "var(--ok)" : pct >= ritmo ? "var(--chart-1)" : "var(--warn)"
        };
      },

      /* El riel de configuración: seis pasos, y el chip «Primeros pasos» de la barra sale de acá. */
      progreso() {
        const pasos = [
          { id: "logo", titulo: "Logo de la clínica", porQue: "Sale en las facturas y en los correos al titular.", href: "/dashboard/administracion/clinica", hecho: !!DB.clinica.logoUrl },
          { id: "horarios", titulo: "Horarios de atención", porQue: "Sin ellos VetGPT no puede ofrecer un espacio libre ni agendar nada.", href: "/dashboard/administracion/clinica?tab=agenda", hecho: DB.horarios.length > 0 },
          { id: "paciente", titulo: "Primer paciente", porQue: "Es lo que convierte la cuenta en una clínica con historia.", href: "/dashboard/patients", hecho: DB.pacientes.length > 0 },
          { id: "servicios", titulo: "Servicios en el catálogo", porQue: "Sin servicios no se puede facturar una consulta.", href: "/dashboard/facturacion/catalogo?tab=servicios", hecho: DB.catalogo.some(i => i.tipo === "SERVICIO" && i.activo) },
          { id: "whatsapp", titulo: "WhatsApp conectado", porQue: "Es por donde salen los recordatorios de cita y de cobro. VetGPT nunca responde solo: sugiere y tú apruebas.", href: "/dashboard/conexiones", hecho: DB.integraciones.whatsapp.estado === "connected" },
          { id: "equipo", titulo: "Equipo invitado", porQue: "Cada quien entra con su usuario y la ficha dice quién atendió.", href: "/dashboard/administracion/clinica?tab=equipo", hecho: DB.usuarios.length > 1 }
        ];
        const hechos = pasos.filter(p => p.hecho).length;
        return { pasos, hechos, total: pasos.length, porcentaje: Math.floor(hechos / pasos.length * 100), completo: hechos === pasos.length, siguiente: pasos.find(p => !p.hecho) || null };
      },

      /* Existencias. El stock no se edita a mano en ningún lado: es el saldo del ítem, y las
         ventas y aplicaciones lo bajan desde donde ocurren. */
      inventario() {
        const conStock = DB.catalogo.filter(i => i.stock && i.activo);
        return {
          activos: DB.catalogo.filter(i => i.activo).length,
          valorCosto: conStock.reduce((s, i) => s + (i.costo || 0) * (i.unidades || 0), 0),
          bajoMinimo: conStock.filter(i => i.unidades > 0 && i.unidades < i.min).length,
          agotados: conStock.filter(i => !i.unidades).length,

        };
      },
      alergiasDe: id => DB.alergias.filter(a => a.patientId === id),
      severas: id => DB.alergias.filter(a => a.patientId === id && a.severidad === "severe"),
      notaDe: consultaId => DB.notas.find(n => n.consultaId === consultaId) || null,
      consultasDe: pid => DB.consultas.filter(c => c.pacienteId === pid).sort((a, b) => aFecha(b.inicio) - aFecha(a.inicio)),
      citasDe: pid => DB.citas.filter(a => a.pacienteId === pid).sort((a, b) => aFecha(b.inicio) - aFecha(a.inicio)),
      facturasDe: oid => DB.facturas.filter(f => f.ownerId === oid).sort((a, b) => aFecha(b.creado) - aFecha(a.creado)),

      /* WhatsApp: la lista de conversaciones se arma agrupando los mensajes por teléfono. */
      conversaciones() {
        const por = new Map();
        for (const m of DB.wa.mensajes) {
          const l = por.get(m.tel) || [];
          l.push(m); por.set(m.tel, l);
        }
        return [...por.entries()].map(([tel, ms]) => {
          ms.sort((a, b) => aFecha(a.cuando) - aFecha(b.cuando));
          return { tel, ultimo: ms[ms.length - 1], sinLeer: ms.filter(m => m.dir === "in" && !m.leido).length, mensajes: ms };
        }).sort((a, b) => aFecha(b.ultimo.cuando) - aFecha(a.ultimo.cuando));
      },
      nombreDeTel(tel) { return DB.wa.contactos.find(c => c.tel === tel)?.nombre || ("+" + tel); },
      sinLeerWA() { return DB.wa.mensajes.filter(m => m.dir === "in" && !m.leido).length; },
      correosSinLeer() { return DB.correos.filter(c => !c.leido).length; },

      /* Los huecos del día salen del horario menos lo ocupado; con eso VetGPT ofrece el espacio. */
      huecosDeHoy(minimo = 30) {
        const hoyDia = HOY.getDay();
        const franjas = DB.horarios.filter(h => h.weekday === hoyDia);
        const aMin = s => Number(s.slice(0, 2)) * 60 + Number(s.slice(3, 5));
        const deMin = m => `${d2(Math.floor(m / 60))}:${d2(m % 60)}`;
        const ocupados = this.citasDeHoy().map(a => ({ de: aFecha(a.inicio).getHours() * 60 + aFecha(a.inicio).getMinutes(), a: aFecha(a.fin).getHours() * 60 + aFecha(a.fin).getMinutes() })).sort((x, y) => x.de - y.de);
        const huecos = [];
        for (const f of franjas) {
          let cur = aMin(f.abre); const cierra = aMin(f.cierra);
          for (const o of ocupados) {
            if (o.a <= cur || o.de >= cierra) continue;
            if (o.de > cur && o.de - cur >= minimo) huecos.push({ desde: deMin(cur), hasta: deMin(Math.min(o.de, cierra)), minutos: Math.min(o.de, cierra) - cur });
            cur = Math.max(cur, o.a);
          }
          if (cierra - cur >= minimo) huecos.push({ desde: deMin(cur), hasta: deMin(cierra), minutos: cierra - cur });
        }
        return huecos;
      },
      /* Lo que el riel de la clínica llama «Requiere atención»: lo que hoy está mal y tiene dueño. */
      pendientes() {
        const out = [];
        const venc = this.carteraVencida();
        if (venc > 0) out.push({ id: "cartera", etiqueta: "Cartera vencida", detalle: fmtCOP(venc) });

        if (sinConf) out.push({ id: "sin-confirmar", etiqueta: "Citas de hoy sin confirmar", detalle: String(sinConf) });
        const agot = DB.catalogo.filter(i => i.stock && i.activo && !i.unidades).length;
        if (agot) out.push({ id: "agotado", etiqueta: "Ítems agotados", detalle: String(agot) });
        return out;
      }
    };

    ];

    function calzar(ruta) {
      for (const r of ROUTES) {
        const a = r.p.split("/").filter(Boolean), b = ruta.split("/").filter(Boolean);
        if (a.length !== b.length) continue;
        const params = {};
        let ok = true;
        for (let i = 0; i < a.length; i++) {
          if (a[i].startsWith(":")) params[a[i].slice(1)] = decodeURIComponent(b[i]);
          else if (a[i] !== b[i]) { ok = false; break; }
        }
        if (ok) return { r, params };
      }
      return null;
    }

    function nav(ruta, reemplazar) {
      /* PARCHE DEMO: nada de location.hash ni history (el navegador los limita por ventana de
         tiempo y el replay navega en cada frame). La ruta vive en __RUTA_DEMO y se pinta ya. */
      void reemplazar;
      window.__RUTA_DEMO = ruta;
      render();
    }

    function leerRuta() {
      const bruto = window.__RUTA_DEMO || location.hash.slice(1) || "/login";   /* PARCHE DEMO */
      const [camino, cola] = bruto.split("?");
      const query = {};
      new URLSearchParams(cola || "").forEach((v, k) => { query[k] = v; });
      return { camino, query };
    }

    /* La navegación entera pasa por acá. Se limpia el ámbito "view" —y sólo ése— para que el
       contador de una pantalla muera al salir pero la grabación y el chat sigan vivos. */
    function render() {
      if (window.__RENDER_MUDO) return;   /* PARCHE DEMO: el replay pinta una sola vez al final */
      SIM.clear("view");
      const { camino, query } = leerRuta();
      UI.ruta = camino; UI.query = query;

      const m = calzar(camino);
      if (!m) { pintar(Pantalla404(camino)); return; }

      const capa = m.r.capa || "app";
      /* Guardas */
      if (capa === "app" && !UI.sesion) { nav("/login", true); return; }
      if (capa === "app" && UI.sesion && UI.sesion.tipo === "clinica" && DB.modo === "nuevo" && !DB.onboardingHecho) { nav("/bienvenida", true); return; }
      if (capa === "plataforma" && (!UI.sesion || UI.sesion.tipo !== "plataforma")) { nav("/login", true); return; }
      if (capa === "acceso" && camino === "/bienvenida" && !UI.sesion) { nav("/login", true); return; }

      let cuerpo;
      try { cuerpo = m.r.v(m.params); }
      catch (e) {
        console.error("Se rompió al pintar", camino, e);
        cuerpo = html`<div class="pagina"><div class="aviso mal">${icon("alerta")}<div><b>Algo se rompió al pintar esta pantalla.</b><div class="sm">${String(e && e.message || e)}</div></div></div></div>`;
      }
      if (cuerpo instanceof Raw && cuerpo.s === "") return;   // la ruta redirigió

      if (capa === "acceso") pintar(cuerpo);
      else if (capa === "plataforma") pintar(LayoutPlataforma(cuerpo));
      else pintar(LayoutApp(cuerpo, m.r.full));
      document.title = tituloDe(camino) + " · Tuvetia";
      /* Lo que scrollea no es la ventana sino `.cuerpo`: el shell ocupa el alto exacto de la
         pantalla. Al cambiar de sección hay que llevarlo arriba, o la pantalla nueva aparece a
         media altura. */
      const c = document.querySelector(".cuerpo");
      if (c) c.scrollTop = 0;
    }
    function pintar(nodo) {
      document.getElementById("app").innerHTML = String(nodo);
      renderFlotantes();
    }

    /* El título de la cabecera. Es un mapa de rutas con caída al prefijo más largo, igual que en
       site-header.tsx: /dashboard/facturacion/cartera hereda «Ventas». */
    const TITULOS = {
      "/dashboard/tablero": "Dashboard", "/dashboard/asistente": "VetGPT", "/dashboard/consultas": "Consultas",
      "/dashboard/patients": "Pacientes", "/dashboard/owners": "Titulares", "/dashboard/calendario": "Agenda",

      "/dashboard/administracion/clinica": "Configuración", "/dashboard/plan": "Plan", "/dashboard/ayuda": "Ayuda",
      "/login": "Ingresar", "/signup": "Crear cuenta", "/bienvenida": "Configura tu clínica", "/admin": "Admin"
    };
    function tituloDe(ruta) {
      if (TITULOS[ruta]) return TITULOS[ruta];
      const m = Object.keys(TITULOS).filter(p => p !== "/dashboard" && ruta.startsWith(p + "/")).sort((a, b) => b.length - a.length)[0];
      return m ? TITULOS[m] : "Dashboard";
    }

    /* Los avisos. Un `toast` con acción es lo que devuelve el «Deshacer» del historial y el
       «Avisar por WhatsApp» al mover una cita. */
    function toast(texto, opts = {}) {
      const id = uid("toast");
      const tono = opts.tono || "ok";
      const ico = tono === "mal" ? "alertaCirculo" : tono === "warn" ? "alerta" : "checkCirculo";
      const cont = document.getElementById("avisos");
      const div = document.createElement("div");
      div.className = `toast ${tono}`;
      div.id = id;
      div.innerHTML = String(html`
    ${icon(ico)}
    <div class="crece">
      <div>${texto}</div>
      ${opts.detalle ? html`<div class="xs mut" style="margin-top:2px">${opts.detalle}</div>` : ""}
    </div>
    ${opts.accion ? html`<button class="acc" data-act="${opts.accion.act}" ${opts.accion.arg ? raw(`data-arg="${esc(opts.accion.arg)}"`) : ""}>${opts.accion.texto}</button>` : ""}`);
      cont.appendChild(div);
      SIM.after("global", opts.duracion || 4200, () => div.remove());
      return id;
    }

    /* ═══════════════════════════════════════════════════════════════════════════════════════════

       primero no es actuar, es saber cómo está el día. Por eso Dashboard encabeza, y después
       Pacientes, Agenda y Ventas.
    
       Los ICONOS SÓLO SE VEN COLAPSADA: expandida, el marcador es un punto —lleno en Consulta,
       hueco en Clínica— y lo que se lee es el nombre.

    /* El historial. SIEMPRE DESPLEGADO: el plegado existió acá y se quitó el 31-ago a pedido de
       David. Sólo se monta dentro de VetGPT y de las consultas; en el resto de la app este
       lugar queda vacío y la barra se ve igual que siempre. */
    function HistorialBarra() {
      const q = UI.histQ.trim().toLowerCase();
      const consultas = DB.consultas.slice().sort((a, b) => aFecha(b.inicio) - aFecha(a.inicio))
        .map(c => ({ k: c.id, href: `/dashboard/consultas/${c.id}`, t: nomP(c.pacienteId), s: `${fecha(c.inicio)} · ${ESTADO_CONSULTA[c.estado] || c.estado}` }));
      const chats = DB.hilos.slice().sort((a, b) => aFecha(b.ultimo) - aFecha(a.ultimo))
        .map(h => ({ k: h.id, href: `/dashboard/asistente?chat=${h.id}`, t: h.titulo, s: h.pacienteId ? `Último mensaje · ${fecha(h.ultimo)}` : `Chat general · ${fecha(h.ultimo)}`, borrable: true }));
      const lista = (UI.histTab === "consultas" ? consultas : chats).filter(i => !q || i.t.toLowerCase().includes(q));

      return html`
  <div class="barra-hist">
    <p class="xs mut" style="padding:2px 8px">Historial</p>
    <button class="btn borde" style="height:32px;font-size:13px" data-act="chat-nuevo">
      ${icon("mas")} Nuevo chat con VetGPT
    </button>
    <div class="buscar">
      ${icon("buscar")}

    </div>
    <div class="tabnav" style="gap:4px">
      <button class="${UI.histTab === "consultas" ? "act" : ""}" data-act="hist-tab" data-arg="consultas">
        ${icon("esteto", "", 13)} Cuaderno <span class="xxs mut">${consultas.length || ""}</span>
      </button>
      <button class="${UI.histTab === "chats" ? "act" : ""}" data-act="hist-tab" data-arg="chats">
        ${icon("chats", "", 13)} Chats <span class="xxs mut">${chats.length || ""}</span>
      </button>
    </div>
    ${lista.length === 0
          ? html`<p class="xs mut" style="padding:12px 8px;line-height:1.5">${q ? "Ningún paciente con ese nombre."
            : UI.histTab === "consultas" ? "Todavía no hay consultas. Empezá una con «Iniciar consulta», acá arriba."
              : "Todavía no hablaste con VetGPT sobre un paciente. Abrí «Nuevo chat con VetGPT» y elegí uno."}</p>`
          : html`<div class="lista">${lista.map(i => html`
          <div class="hist-item ${UI.query.chat === i.k || UI.ruta === i.href ? "act" : ""}" data-act="ir" data-arg="${i.href}">
            <span class="t trunc">${i.t}</span>
            <span class="s trunc">${i.s}</span>
          </div>`)}</div>`}
  </div>`;
    }

    /* ── Los flotantes: el notch de la consulta y el dock de VetGPT ──────────────────────────────
       Viven fuera del árbol de la vista y se repintan aparte, así navegar no corta una grabación
       ni cierra el chat a medio escribir. */
    function renderFlotantes() {
      const cont = document.getElementById("flotantes");
      if (!cont) return;
      const enSuConsulta = VIVO.consultaId && UI.ruta === `/dashboard/consultas/${VIVO.consultaId}`;
      const mostrarNotch = VIVO.fase !== "inactiva" && VIVO.fase !== "terminada" && !enSuConsulta;
      const mostrarDock = UI.sesion?.tipo === "clinica" && !UI.ruta.startsWith("/dashboard/asistente");
      cont.innerHTML = String(html`
    ${mostrarNotch ? Notch() : ""}
    ${mostrarDock ? Dock() : ""}`);

    /* ═══════════════════════════════════════════════════════════════════════════════════════════
       [J12] TABLERO
    
       Ocho bloques en una grilla de cinco columnas, reordenables y apagables desde «Armá tu
       tablero». Los gráficos son SVG a mano: una dona con stroke-dasharray, barras con rects y
       un anillo con su aguja de ritmo. Sin librerías, y así el archivo abre sin internet.
       ═══════════════════════════════════════════════════════════════════════════════════════════ */

    /* ── Gráficos ─────────────────────────────────────────────────────────────────────────────── */
    function Dona(datos, centro) {
      const total = datos.reduce((s, d) => s + d.valor, 0) || 1;
      const R = 62, C = 2 * Math.PI * R;
      let off = 0;
      const arcos = datos.map(d => {
        const largo = d.valor / total * C;
        const s = html`<circle cx="85" cy="85" r="${R}" fill="none" stroke="${d.color}" stroke-width="27"
      stroke-dasharray="${(largo - 3).toFixed(2)} ${(C - largo + 3).toFixed(2)}"
      stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 85 85)"><title>${d.rot}</title></circle>`;
        off += largo; return s;
      });
      return html`
    <div class="dona-svg">
      <svg viewBox="0 0 170 170" width="170" height="170" role="img">${arcos}</svg>
      <div class="dona-centro">${centro}</div>
    </div>`;
    }
    function Leyenda(datos, fmt) {
      const total = datos.reduce((s, d) => s + d.valor, 0) || 1;
      return html`<ul class="leyenda">${datos.map(d => {
        const pct = Math.round(d.valor / total * 100);
        return html`<li>
      <div class="fila"><span class="pto" style="background:${d.color}"></span>
        <span class="crece trunc mut">${d.rot}</span>
        <span class="mono xs">${fmt(d.valor)}</span>
        <span class="xs mut" style="width:38px;text-align:right">${pct}%</span></div>
      <div class="prop"><i style="width:${pct}%;background:${d.color}"></i></div>
    </li>`;
      })}</ul>`;
    }
    /* Las barras usan un viewBox proporcional: con preserveAspectRatio="none" los rótulos se
       deforman al estirarse, que es exactamente el defecto que tenía la primera versión. */
    function Barras(serie) {
      const W = 700, H = 210, izq = 30, abajo = 26, arriba = 8;
      const max = Math.max(1, ...serie.map(d => d.n));
      const anchoUtil = W - izq - 8, alto = H - abajo - arriba;
      const paso = anchoUtil / serie.length;
      const ancho = Math.min(34, paso * 0.62);
      const lineas = [0, 0.25, 0.5, 0.75, 1].map(f => {
        const y = arriba + alto * (1 - f);
        return html`<line x1="${izq}" y1="${y}" x2="${W - 8}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 3"/>
      <text x="${izq - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(max * f)}</text>`;
      });
      return html`
  <svg viewBox="0 0 ${W} ${H}" width="100%" height="210" role="img" aria-label="Consultas por semana">
    ${lineas}
    ${serie.map((d, i) => {
        const h = d.n / max * alto;
        const x = izq + paso * i + (paso - ancho) / 2;
        const y = arriba + alto - h;
        return html`<g><rect x="${x}" y="${y}" width="${ancho}" height="${Math.max(0, h)}" rx="4"
          fill="var(--chart-1)" fill-opacity="${i === serie.length - 1 ? 1 : .45}"><title>${d.rot}: ${d.n}</title></rect>
        ${i % 2 === 0 || i === serie.length - 1
            ? html`<text x="${x + ancho / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.rot}</text>` : ""}</g>`;
      })}
  </svg>`;
    }
    /* El anillo del cumplimiento, con la aguja del ritmo: sin ella un 62% no dice si vas bien. */
    function Anillo(c) {
      const R = 62, C = 2 * Math.PI * R, largo = c.arco / 100 * C;
      return html`
  <div class="dona-svg">
    <svg viewBox="0 0 170 170" width="170" height="170" role="img">
      <circle cx="85" cy="85" r="${R}" fill="none" stroke="var(--border)" stroke-width="24"/>
      <circle cx="85" cy="85" r="${R}" fill="none" stroke="${c.color}" stroke-width="24" stroke-linecap="round"
        stroke-dasharray="${largo.toFixed(2)} ${(C - largo).toFixed(2)}" transform="rotate(-90 85 85)"/>
      <g transform="rotate(${c.ritmo * 3.6} 85 85)">
        <rect x="84" y="8" width="2" height="24" rx="1" fill="var(--text)" opacity=".45"><title>Ritmo del mes: ${c.ritmo}%</title></rect>
      </g>
    </svg>
    <div class="dona-centro">
      <span style="font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;color:${c.color}">${c.pct}%</span>
      <span class="mono xxs mut">${fmtCOP(c.vendido)}</span>
    </div>
  </div>`;
    }

    /* ── Las pastillas ────────────────────────────────────────────────────────────────────────── */
    const METRICAS = {
      "consultas-mes": { rot: "Consultas este mes", pie: "Consultas registradas en la clínica", desc: "Cuántas consultas se abrieron desde el primero del mes.", ico: "esteto", tono: "var(--chart-1)", porDefecto: true },
      "pacientes": { rot: "Pacientes", pie: "Fichas activas en la clínica", desc: "El total de mascotas con ficha.", ico: "huella", tono: "var(--chart-3)", porDefecto: true },
      "citas-7d": { rot: "Citas (próx. 7 días)", pie: "Agenda de la semana", desc: "Lo que viene en la semana, sin contar las canceladas.", ico: "calendarioDias", tono: "var(--chart-5)", porDefecto: true },
      "notas-borrador": { rot: "Notas por revisar", pie: "Borradores de VetGPT pendientes de aprobar", desc: "Las que todavía no entraron a la historia clínica.", ico: "documentoReloj", tono: "var(--chart-2)", porDefecto: true },
      "consultas-hoy": { rot: "Consultas de hoy", pie: "Abiertas desde la medianoche", desc: "Cómo viene el día, no el mes.", ico: "esteto", tono: "var(--chart-1)" },
      "citas-hoy": { rot: "Citas de hoy", pie: "Lo que queda por atender hoy", desc: "Las de hoy, sin las canceladas ni las que no se presentaron.", ico: "calendarioReloj", tono: "var(--chart-5)" },
      "titulares": { rot: "Titulares", pie: "Dueños registrados", desc: "Cuántas personas, no cuántas mascotas.", ico: "usuarios", tono: "var(--chart-3)" },
      "pacientes-nuevos-mes": { rot: "Pacientes nuevos", pie: "Fichas creadas este mes", desc: "Si la clínica está creciendo se ve acá, no en el total.", ico: "sube", tono: "var(--chart-3)" },
      "vacunas-por-vencer": { rot: "Refuerzos por vencer", pie: "Próximos 30 días, y los ya vencidos", desc: "La cifra que se convierte en llamadas: quién tiene que volver.", ico: "jeringa", tono: "var(--chart-2)" },
      "facturado-mes": { rot: "Facturado este mes", pie: "Facturas emitidas desde el primero", desc: "Lo que se facturó, esté cobrado o no.", ico: "billete", tono: "var(--chart-4)", requiere: "facturacion" },
      "por-cobrar": { rot: "Por cobrar", pie: "Saldo pendiente de las facturas emitidas", desc: "Lo que falta que entre. Distinto de lo facturado.", ico: "monedas", tono: "var(--chart-4)", requiere: "facturacion" }
    };
    function valorDeMetrica(id) {
      switch (id) {
        case "consultas-mes": return String(SEL.consultasMes());
        case "pacientes": return String(DB.pacientes.length);
        case "citas-7d": return String(SEL.citasProx7());
        case "notas-borrador": return String(SEL.notasBorrador().length);
        case "consultas-hoy": return String(SEL.consultasHoy());
        case "citas-hoy": return String(SEL.citasHoy());
        case "titulares": return String(DB.titulares.length);
        case "pacientes-nuevos-mes": return String(SEL.pacientesNuevosMes());
        case "vacunas-por-vencer": return String(SEL.vacunasPorVencer());
        case "facturado-mes": return fmtCOP(SEL.facturadoMes());
        case "por-cobrar": return fmtCOP(SEL.porCobrar());
        default: return "—";
      }
    }
    /* La comparación es «frente a la misma altura del mes pasado». Sólo dos métricas la tienen:
       las demás no se comparan con nada que signifique algo. */
    function variacionDeMetrica(id) {
      const calc = (a, b) => b > 0 ? { pct: Math.round((a - b) / b * 100), sube: a >= b } : null;
      if (id === "consultas-mes") return calc(SEL.consultasMes(), SEL.consultasMesAnterior());
      if (id === "facturado-mes") return calc(SEL.facturadoMes(), SEL.facturadoMesAnterior());
      return null;
    }
    function StatCard(id) {
      const m = METRICAS[id]; if (!m) return "";
      const v = variacionDeMetrica(id);
      return html`
  <button class="stat" data-act="ver-pastilla" data-arg="${id}">
    <span class="flecha" aria-hidden="true">${icon("flechaDiag")}</span>
    <span class="cab">
      <span class="chip-ico" style="background:color-mix(in oklab, ${m.tono} 13%, transparent);color:${m.tono}">${icon(m.ico)}</span>
      <span class="crece" style="min-width:0"><span class="rot" style="display:block">${m.rot}</span></span>
    </span>
    ${v ? html`<span class="var" title="frente a la misma altura del mes pasado"
        style="background:${v.sube ? "var(--tv-mint-500)" : "var(--tv-red-500)"}">
        ${icon(v.sube ? "sube" : "baja", "", 12)}${v.pct > 0 ? "+" : ""}${v.pct}%</span>` : ""}
    <span class="cifra">${valorDeMetrica(id)}</span>
    <span class="pie">${m.pie}</span>
  </button>`;
    }

    function VistaTablero() {
      const prog = SEL.progreso();
      const hoyTexto = mayus1(diaLargo(HOY));
      const metricas = DB.tablero.metricas.filter(p => p.visible)
        .filter(p => METRICAS[p.id].requiere !== "facturacion" || DB.clinica.facturacionActiva);
      const BLOQUES = {
        riel: { ancho: "g5", nodo: prog.completo ? null : RielConfiguracion(prog) },
        metricas: { ancho: "g5", nodo: html`<div class="pastillas">${metricas.map(p => StatCard(p.id))}</div>` },
        grafico: { ancho: "g3", nodo: BloqueGrafico() },

    /* La vista rápida de una pastilla: un vistazo sin salir del tablero. Cada fila abre lo suyo. */
    const DESTINOS_METRICA = {
      "consultas-mes": { todo: "/dashboard/consultas", texto: "Ver todas las consultas" },
      "consultas-hoy": { todo: "/dashboard/consultas", texto: "Ver todas las consultas" },
      "pacientes": { todo: "/dashboard/patients", texto: "Ver todos los pacientes" },
      "pacientes-nuevos-mes": { todo: "/dashboard/patients", texto: "Ver todos los pacientes" },
      "pacientes-activos": { todo: "/dashboard/patients", texto: "Ver todos los pacientes" },
      "vacunas-por-vencer": { todo: "/dashboard/patients", texto: "Ver todos los pacientes" },
      "citas-7d": { todo: "/dashboard/calendario", texto: "Ver la agenda" },
      "citas-hoy": { todo: "/dashboard/calendario", texto: "Ver la agenda" },

    function filasDeMetrica(id) {
      const f = (href, titulo, detalle, cuando) => ({ href, titulo, detalle, cuando });
      switch (id) {
        case "consultas-mes": case "consultas-hoy": case "consultas-revision":
          return DB.consultas.filter(c => id === "consultas-hoy" ? esHoy(c.inicio) : id === "consultas-revision" ? c.estado === "review" : enMes(c.inicio))
            .map(c => f(`/dashboard/consultas/${c.id}`, nomP(c.pacienteId), c.motivo, c.inicio));
        case "pacientes": case "pacientes-activos":
          return DB.pacientes.map(p => f(`/dashboard/patients/${p.id}`, p.nombre, `${p.especie}${p.raza ? " · " + p.raza : ""}`, null));
        case "pacientes-nuevos-mes":
          return DB.pacientes.filter(p => enMes(p.creado)).map(p => f(`/dashboard/patients/${p.id}`, p.nombre, p.especie, p.creado));
        case "vacunas-por-vencer":
          return DB.vacunas.filter(v => v.proxima && aFecha(v.proxima).getTime() <= Date.now() + 30 * 864e5)
            .map(v => f(`/dashboard/patients/${v.patientId}`, nomP(v.patientId), v.nombre, v.proxima));
        case "citas-7d": case "citas-hoy":
          return (id === "citas-hoy" ? SEL.citasDeHoy() : SEL.citasVivas().filter(a => { const t = aFecha(a.inicio).getTime(); return t >= Date.now() && t <= Date.now() + 7 * 864e5; }))
            .map(a => f("/dashboard/calendario", a.pacienteId ? nomP(a.pacienteId) : a.titulo, a.titulo, a.inicio));
        case "notas-borrador":
          return SEL.notasBorrador().map(n => f(`/dashboard/consultas/${n.consultaId}`, nomP(getC(n.consultaId)?.pacienteId), "Borrador sin aprobar", n.generadaIA));
        case "titulares":
          return DB.titulares.map(o => f(`/dashboard/owners/${o.id}`, o.nombre, o.tel, null));
        case "facturado-mes":
          return SEL.delMes(SEL.emitidas()).map(f2 => f(`/dashboard/facturacion/${f2.id}`, f2.numero || "Borrador", nomO(f2.ownerId) + " · " + fmtCOP(totalDeFactura(f2)), f2.emitido));
        case "por-cobrar":
          return SEL.porCobrarLista().map(f2 => f(`/dashboard/facturacion/${f2.id}`, f2.numero || "Borrador", nomO(f2.ownerId) + " · saldo " + fmtCOP(saldoDeFactura(f2)), f2.vence));
        default: return [];
      }
    }
    function abrirPastilla(id) {

    function abrirPersonalizar() {

      </div>`,
        pie: html`
      <button class="btn fantasma chico" style="margin-right:auto" data-act="tablero-reset">${icon("rehacer")} Como venía</button>
      ${esAdmin() ? html`<button class="btn borde chico" data-act="tablero-clinica" title="Quien todavía no armó su tablero entrará con esta disposición.">${icon("edificio")} Dejar como entrada de la clínica</button>` : ""}

    /* ═══════════════════════════════════════════════════════════════════════════════════════════
       [J13] PACIENTES Y TITULARES
    
       Titulares dejó de ser una entrada de la barra: ahora es una VISTA dentro de Pacientes, que
       es la fusión que pidió el cliente. La ruta sigue existiendo porque es el único lugar donde
       vive el consentimiento de grabación del titular.
       ═══════════════════════════════════════════════════════════════════════════════════════════ */
    const SEXO = { male: "Macho", female: "Hembra", unknown: "—" };
    const SEVERIDAD = { mild: "leve", moderate: "moderada", severe: "severa" };

    function edadCorta(nace) {
      if (!nace) return "—";
      const d = new Date(nace), h = new Date();
      let m = (h.getFullYear() - d.getFullYear()) * 12 + (h.getMonth() - d.getMonth());
      if (h.getDate() < d.getDate()) m--;
      return m < 24 ? `${m} m` : `${Math.floor(m / 12)} a`;
    }
    function edadLarga(nace) {
      if (!nace) return "Edad desconocida";
      const d = new Date(nace), h = new Date();
      let m = (h.getFullYear() - d.getFullYear()) * 12 + (h.getMonth() - d.getMonth());
      if (h.getDate() < d.getDate()) m--;
      const a = Math.floor(m / 12), r = m % 12;
      return a ? `${a} ${a === 1 ? "año" : "años"}${r ? ` y ${r} ${r === 1 ? "mes" : "meses"}` : ""}` : `${m} ${m === 1 ? "mes" : "meses"}`;
    }
    function AlertaClinica(pid) {
      const al = SEL.alergiasDe(pid);
      if (!al.length) return html`<span class="xs faint">—</span>`;
      const grave = al.some(a => a.severidad === "severe");
      const peor = al.find(a => a.severidad === "severe") || al[0];
      return html`<span class="alerta-clinica ${grave ? "grave" : "leve"}" title="${al.map(a => `${a.alergeno} (${SEVERIDAD[a.severidad]})`).join(" · ")}">
    <i style="background:currentColor"></i><span class="trunc">${peor.alergeno}${al.length > 1 ? ` +${al.length - 1}` : ""}</span></span>`;
    }
    function VistaPacientesTitulares(activa) {
      return html`
  <div class="segmento suave" role="navigation" aria-label="Vista de pacientes o titulares">
    <a class="${activa === "p" ? "act" : ""}" data-act="ir" data-arg="/dashboard/patients">Pacientes</a>
    <a class="${activa === "o" ? "act" : ""}" data-act="ir" data-arg="/dashboard/owners">Titulares</a>
  </div>`;
    }

    function VistaPacientes() {
      const q = (UI.query.q ?? FL.pacientesQ).trim().toLowerCase();
      const bucket = e => { const s = (e || "").toLowerCase(); return s.startsWith("perr") ? "perros" : s.startsWith("gat") ? "gatos" : "otros"; };
      const lista = DB.pacientes.filter(p => {
        if (FL.pacientesEspecie && bucket(p.especie) !== FL.pacientesEspecie) return false;
        if (!q) return true;
        const o = getO(p.ownerId);
        return p.nombre.toLowerCase().includes(q) || (o?.nombre ?? "").toLowerCase().includes(q) || (o?.tel ?? "").includes(q);
      });
      const activos = DB.pacientes.filter(p => !p.fallecido).length;
      const pastillas = [
        ["pacientes-activos", "Pacientes activos", String(activos), "Sin contar los fallecidos", "huella", "var(--chart-3)"],
        ["citas-hoy", "Citas hoy", String(SEL.citasHoy()), "Agendadas para hoy", "calendarioReloj", "var(--chart-5)"],

    function VistaPaciente(id) {

      const vac = DB.vacunas.filter(v => v.patientId === id).sort((a, b) => aFecha(b.aplicada) - aFecha(a.aplicada));
      const consultas = SEL.consultasDe(id), citas = SEL.citasDe(id);
      /* El informe al titular sale de la consulta más reciente con nota aprobada: es el mismo
         diálogo y el mismo envío de la consulta (abrirInforme), no un segundo informe. */

      const adj = DB.adjuntos.filter(a => a.patientId === id);
      const plan = DB.planesDePaciente.find(x => x.patientId === id);
      const meta = [p.especie, p.raza, SEXO[p.sexo], edadLarga(p.nace), p.peso ? `${p.peso} kg` : null, p.color].filter(Boolean).join(" · ");

      const tarjeta = (ico, tit, accion, cuerpo) => html`
    <div class="card pad">
      <div class="entre" style="margin-bottom:8px">
        <div class="fila sm semi">${icon(ico, "faint", 15)} ${tit}</div>${accion || ""}
      </div>${cuerpo}
    </div>`;

      return html`
  <div class="pagina">
    <a class="volver" data-act="ir" data-arg="/dashboard/patients">${icon("flechaIzq")} Volver a pacientes</a>

    <div class="ficha-cab">

        : html`<ul class="col sm" style="gap:6px">${al.map(a => html`
            <li class="fila"><span style="width:6px;height:6px;border-radius:50%;flex:none;background:${a.severidad === "severe" ? "var(--danger)" : "var(--muted)"}"></span>

      ${tarjeta("pastilla", "Medicación", html`<button class="btn fantasma chico" data-act="agregar-med" data-arg="${p.id}">${icon("mas", "", 13)} Agregar</button>`,
          meds.length === 0 ? html`<p class="sm mut">Sin medicación registrada.</p>`
            : html`<ul class="col sm" style="gap:6px">${meds.map(m => html`
            <li class="filaw" style="gap:6px"><span class="semi">${m.farmaco}</span><span class="mut">${m.dosis}</span>

        </tr>`)}

            const n = SEL.notaDe(c.id);
            return html`
        <details class="hist-consulta" ${i === 0 ? "open" : ""}>
          <summary>
            <span class="mono xs mut" style="width:110px">${fecha(c.inicio)}</span>
            <span class="crece trunc sm">${n?.a ? textoPlano(n.a).slice(0, 90) : c.motivo}</span>
            ${n ? html`<span class="badge ${n.estado === "approved" ? "marca" : "neutro"}">${n.estado === "approved" ? "Aprobada" : "Borrador"}</span>`
                : html`<span class="xs mut">Sin nota</span>`}
            ${icon("abajo", "faint", 15)}
          </summary>
          <div class="pad" style="border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:12px">
            ${c.audioSeg ? html`
              <div class="fila panel" style="padding:8px 12px;gap:10px">
                ${icon("ondas", "faint", 16)}

  </div>`;

    /* ═══════════════════════════════════════════════════════════════════════════════════════════
       [J14] AGENDA
    
       Cinco vistas: Mes, Semana, Día, Lista y Programador (una columna por veterinario). La de
       semana es UNA sola grilla de ocho columnas —la de horas más siete días— porque cosiendo dos
       grillas distintas las citas caen corridas un día, y eso no se ve hasta que alguien lo mira.
       ═══════════════════════════════════════════════════════════════════════════════════════════ */
    const ESTADO_CITA = {
      scheduled: { rot: "Agendada", color: "var(--status-scheduled)" },
      confirmed: { rot: "Confirmada", color: "var(--status-confirmed)" },
      in_progress: { rot: "En curso", color: "var(--status-in-progress)" },
      completed: { rot: "Completada", color: "var(--status-completed)" },
      canceled: { rot: "Cancelada", color: "var(--status-canceled)" },
      no_show: { rot: "No asistió", color: "var(--status-no-show)" }
    };
    const TIPOS_CITA = [
      { id: "consulta_general", rot: "Consulta general", color: "var(--accent)", min: 30 },
      { id: "control", rot: "Control", color: "var(--info)", min: 20 },
      { id: "vacunacion", rot: "Vacunación", color: "var(--ok)", min: 20 },
      { id: "desparasitacion", rot: "Desparasitación", color: "var(--ok)", min: 15 },
      { id: "consulta_especializada", rot: "Consulta especializada", color: "var(--brand-deep)", min: 45 },
      { id: "cirugia", rot: "Cirugía", color: "var(--danger)", min: 90 },
      { id: "urgencia", rot: "Urgencia", color: "var(--danger)", min: 45 },
      { id: "laboratorio", rot: "Examen de laboratorio", color: "var(--info)", min: 20 },
      { id: "imagenes", rot: "Imágenes diagnósticas", color: "var(--info)", min: 30 },
      { id: "peluqueria", rot: "Peluquería o spa", color: "var(--warn)", min: 60 },
      { id: "otro", rot: "Otro", color: "var(--muted)", min: 30 }
    ];
    const TIPO_BLOQUEO = { id: "bloqueo", rot: "Espacio reservado", color: "var(--muted)", min: 60 };
    const tipoDeCita = id => id === "bloqueo" ? TIPO_BLOQUEO : (TIPOS_CITA.find(t => t.id === id) || null);
    const colorCita = a => a.bloqueo ? TIPO_BLOQUEO.color : (ESTADO_CITA[a.estado]?.color || "var(--accent)");
    const rotuloCita = a => (a.pacienteId ? nomP(a.pacienteId) + " — " : "") + a.titulo;

    function VistaAgenda() {
      const citas = DB.citas.filter(a => {
        if (CAL.vets && a.vetId && !CAL.vets.has(a.vetId)) return false;
        if (CAL.q) { const q = CAL.q.toLowerCase(); if (!(a.titulo.toLowerCase().includes(q) || nomP(a.pacienteId).toLowerCase().includes(q))) return false; }
        return true;
      });
      return html`
  <div class="pagina" style="flex:1;min-height:0">
    ${DB.integraciones.calendario.conectado ? "" : html`
      <div class="aviso warn">${icon("calendarioDias")}
        <div class="crece"><b>Tu calendario no está conectado.</b> Las citas quedan sólo en Tuvetia y nadie recibe invitación.</div>
        <button class="btn borde chico" data-act="ir" data-arg="/dashboard/conexiones">Conectar</button></div>`}
    ${DiaDeHoy()}
    <div class="agenda">
      ${PanelDeAgenda()}
      <div class="cal">
        <div class="entre" style="flex-wrap:wrap">
          <div class="filaw">
            <button class="btn borde chico" data-act="cal-hoy">Hoy</button>
            <span class="segmento" style="padding:0">
              <button class="acceso" data-act="cal-mover" data-arg="-1" aria-label="Anterior">${icon("izq", "", 15)}</button>
              <button class="acceso" data-act="cal-mover" data-arg="1" aria-label="Siguiente">${icon("der", "", 15)}</button>
            </span>
            <span class="display" style="font-size:17px;font-weight:500;text-transform:capitalize">${rotuloRango()}</span>
          </div>
          <div class="filaw">
            <div class="buscar" style="width:200px">${icon("buscar")}<input class="campo" style="height:30px" placeholder="Buscar cita…" value="${CAL.q}" data-act="cal-buscar"></div>
            <div class="segmento" role="group">
              ${["Mes", "Semana", "Día", "Lista", "Programador"].map(v => html`
                <button class="${CAL.vista === v ? "act" : ""}" data-act="cal-vista" data-arg="${v}" aria-pressed="${CAL.vista === v}">${v}</button>`)}
            </div>
            <button class="btn chico" data-act="nueva-cita">${icon("mas")} Nueva cita</button>
          </div>
        </div>
        ${CAL.vista === "Mes" ? CalMes(citas)
          : CAL.vista === "Semana" ? CalSemana(citas)
            : CAL.vista === "Día" ? CalDia(citas)
              : CAL.vista === "Lista" ? CalLista(citas)
                : CalProgramador(citas)}
      </div>
    </div>
  </div>`;
    }

    function rotuloRango() {
      const d = CAL.fecha;
      if (CAL.vista === "Mes") return `${MESES[d.getMonth()]} ${d.getFullYear()}`;
      if (CAL.vista === "Semana") {
        const l = lunesDe(d); const dom = new Date(l); dom.setDate(dom.getDate() + 6);
        return `${l.getDate()} ${MESES_C[l.getMonth()]} — ${dom.getDate()} ${MESES_C[dom.getMonth()]} ${dom.getFullYear()}`;
      }
      return diaLargo(d);
    }
    function lunesDe(d) { const x = new Date(d); const i = (x.getDay() + 6) % 7; x.setDate(x.getDate() - i); x.setHours(0, 0, 0, 0); return x; }

    /* «Hoy»: las citas y los huecos del día en una sola fila ordenada por hora. El botón de cada
       hueco lo manda a VetGPT con el pedido ya escrito, que es lo que convierte un espacio muerto
       en una llamada. */
    function DiaDeHoy() {
      const citas = SEL.citasDeHoy(), huecos = SEL.huecosDeHoy();
      if (!citas.length && !huecos.length) return "";
      const filas = [
        ...citas.map(c => ({ orden: hora(c.inicio), tipo: "cita", c })),
        ...huecos.map(h => ({ orden: h.desde, tipo: "hueco", h }))
      ].sort((a, b) => a.orden.localeCompare(b.orden));
      const ET = { scheduled: ["Sin confirmar", "warn"], confirmed: ["Confirmada", "marca"], in_progress: ["En curso", "marca"] };
      return html`
  <section class="card" style="overflow:hidden">
    <button class="fila" style="width:100%;padding:10px 16px;border:0;background:none;cursor:pointer;text-align:left;${UI.hoyAbierto ? "border-bottom:1px solid var(--border)" : ""}"
            data-act="hoy-alternar" aria-expanded="${UI.hoyAbierto}">
      <span class="rotulo">Hoy</span>
      <span class="crece trunc sm mut" style="text-align:right">
        ${citas.length === 1 ? "1 cita" : citas.length + " citas"}${huecos.length ? ` · ${huecos.length === 1 ? "1 espacio libre" : huecos.length + " espacios libres"}` : ""}
      </span>
      <span style="color:var(--muted);transform:rotate(${UI.hoyAbierto ? 0 : -90}deg)">${icon("abajo", "", 14)}</span>
    </button>
    ${UI.hoyAbierto ? html`<div style="max-height:30svh;overflow-y:auto">${filas.map(f => f.tipo === "cita"
        ? html`<div class="fila divide" style="padding:9px 16px;border-top:1px solid var(--border-soft)">
          <span class="mono sm mut" style="width:48px">${f.orden}</span>
          <span class="crece trunc sm">${rotuloCita(f.c)}</span>
          ${ET[f.c.estado] ? html`<span class="badge ${ET[f.c.estado][1]}">${ET[f.c.estado][0]}</span>` : ""}
        </div>`
        : html`<div class="fila" style="padding:9px 16px;border-top:1px solid var(--border-soft)">
          <span class="mono sm faint" style="width:48px">${f.h.desde}</span>
          <span class="crece trunc sm mut">${f.h.minutos >= 60 ? Math.floor(f.h.minutos / 60) + " h " + (f.h.minutos % 60 ? (f.h.minutos % 60) + " min" : "") : f.h.minutos + " min"} libres</span>
          <button class="btn fantasma chico" data-act="ofrecer-hueco" data-arg="${f.h.desde}:${f.h.minutos}">Ofrecerlo con VetGPT</button>
        </div>`)}</div>` : ""}
  </section>`;
    }

    function PanelDeAgenda() {
      const avisos = DB.clinica.confirmacionCitas || DB.clinica.recordatorioCitas;
      const [y, m] = CAL.mes.split("-").map(Number);
      const primero = new Date(y, m - 1, 1);
      const inicio = lunesDe(primero);
      const celdas = [];
      for (let i = 0; i < 42; i++) { const d = new Date(inicio); d.setDate(d.getDate() + i); celdas.push(d); }
      const sel = iso(CAL.fecha), hoyIso = iso(HOY);
      return html`
  <aside class="agenda-panel">
    <section class="card pad" style="padding:12px">
      <div class="fila" style="align-items:flex-start;gap:10px">
        ${icon("campana", "faint", 15)}
        <div class="crece">
          <p class="sm semi">Avisos por WhatsApp</p>
          <p class="xs mut" style="line-height:1.35;margin-top:2px">${avisos ? "Al titular se le avisa al agendar y antes de la cita." : "Apagados: el titular no recibe aviso de sus citas."}</p>
          <a class="xs semi marca" style="display:inline-block;margin-top:6px" data-act="ir" data-arg="/dashboard/administracion/clinica?tab=agenda">${avisos ? "Cambiar" : "Encender"}</a>
        </div>
      </div>
    </section>
    <section>
      <div class="entre" style="margin-bottom:8px;gap:4px">
        <button class="acceso" data-act="mini-mes" data-arg="-1" aria-label="Mes anterior">${icon("izq", "", 15)}</button>
        <span class="sm semi" style="text-transform:capitalize">${MESES[m - 1]} ${y}</span>
        <button class="acceso" data-act="mini-mes" data-arg="1" aria-label="Mes siguiente">${icon("der", "", 15)}</button>
      </div>
      <div class="mini-mes">
        ${["L", "M", "M", "J", "V", "S", "D"].map(d => html`<span class="d">${d}</span>`)}
        ${celdas.map(d => {
        const i = iso(d);
        const cls = i === sel ? "sel" : i === hoyIso ? "hoy" : d.getMonth() !== m - 1 ? "fuera" : "";
        return html`<button class="${cls}" data-act="cal-dia" data-arg="${i}" aria-label="${i}">${d.getDate()}</button>`;
      })}
      </div>
    </section>
    ${DB.usuarios.length > 1 ? html`
    <section>
      <p class="rotulo" style="margin-bottom:8px">Calendarios</p>
      <ul class="col" style="gap:2px">${DB.usuarios.map(u => {
        const vis = !CAL.vets || CAL.vets.has(u.id);
        return html`<li><label class="fila sm" style="padding:6px;border-radius:6px;cursor:pointer">
          <input class="check" style="width:14px;height:14px" type="checkbox" ${vis ? "checked" : ""} data-act="cal-vet" data-arg="${u.id}">
          <span class="trunc ${vis ? "" : "faint"}">${u.nombre}</span></label></li>`;
      })}</ul>
    </section>` : ""}
    <section>
      <p class="rotulo" style="margin-bottom:8px">Tipos de cita</p>
      <ul class="col" style="gap:4px">${TIPOS_CITA.slice(0, 6).map(t => html`
        <li class="fila xs mut"><span style="width:8px;height:8px;border-radius:3px;background:${t.color}"></span>${t.rot}<span class="faint" style="margin-left:auto">${t.min}′</span></li>`)}</ul>
    </section>
  </aside>`;
    }

    function CalMes(citas) {
      const d = CAL.fecha;
      const primero = new Date(d.getFullYear(), d.getMonth(), 1);
      const inicio = lunesDe(primero);
      const celdas = [];
      for (let i = 0; i < 42; i++) { const x = new Date(inicio); x.setDate(x.getDate() + i); celdas.push(x); }
      return html`
  <div class="cal-mes">
    ${["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"].map(x => html`<div class="cab-d">${x}</div>`)}
    ${celdas.map(x => {
        const delMes = x.getMonth() === d.getMonth();
        const delDia = citas.filter(a => iso(aFecha(a.inicio)) === iso(x)).sort((a, b) => aFecha(a.inicio) - aFecha(b.inicio));
        return html`
      <div class="celda ${delMes ? "" : "fuera"}" data-act="cal-nueva" data-arg="${iso(x)}">
        <span class="n ${iso(x) === iso(HOY) ? "hoy" : ""}">${x.getDate()}</span>
        ${delDia.slice(0, 3).map(a => html`
          <button class="ev" style="background:${colorCita(a)}" data-act="abrir-cita" data-arg="${a.id}" title="${rotuloCita(a)}">
            ${hora(a.inicio)} ${rotuloCita(a)}</button>`)}
        ${delDia.length > 3 ? html`<span class="xxs mut" style="display:block;margin-top:2px">+${delDia.length - 3} más</span>` : ""}
      </div>`;
      })}
  </div>`;
    }

    /* UNA grilla de 8 columnas: la cabecera y las celdas comparten pistas. */
    function CalSemana(citas) {
      const l = lunesDe(CAL.fecha);
      const dias7 = Array.from({ length: 7 }, (_, i) => { const x = new Date(l); x.setDate(x.getDate() + i); return x; });
      const desde = 7, hasta = 20;
      const horas = Array.from({ length: hasta - desde }, (_, i) => desde + i);
      return html`
  <div class="cal-sem" style="max-height:62vh;overflow-y:auto">
    <div class="cab-d"></div>
    ${dias7.map(x => html`<div class="cab-d">
      <div class="xxs mut" style="text-transform:uppercase;letter-spacing:.06em">${DIAS_C[x.getDay()]}</div>
      <div style="margin:2px auto 0;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:600;${iso(x) === iso(HOY) ? "background:var(--accent);color:var(--on-brand)" : ""}">${x.getDate()}</div>
    </div>`)}
    ${horas.map(h => html`
      <div class="hora">${h % 12 === 0 ? 12 : h % 12} ${h < 12 ? "AM" : "PM"}</div>
      ${dias7.map(x => {
        const enEsta = citas.filter(a => { const s = aFecha(a.inicio); return iso(s) === iso(x) && s.getHours() === h; });
        return html`<div class="ranura" data-act="cal-nueva" data-arg="${iso(x)}T${d2(h)}:00">
          ${enEsta.map(a => html`<button class="ev" style="background:${colorCita(a)}" data-act="abrir-cita" data-arg="${a.id}" title="${rotuloCita(a)}">${hora(a.inicio)} ${rotuloCita(a)}</button>`)}
        </div>`;
      })}`)}
  </div>`;
    }

    function CalDia(citas) {
      const delDia = citas.filter(a => iso(aFecha(a.inicio)) === iso(CAL.fecha)).sort((a, b) => aFecha(a.inicio) - aFecha(b.inicio));
      const horas = Array.from({ length: 13 }, (_, i) => 7 + i);
      return html`
  <div class="card" style="overflow:hidden;max-height:62vh;overflow-y:auto">
    ${horas.map(h => {
        const enEsta = delDia.filter(a => aFecha(a.inicio).getHours() === h);
        return html`<div class="fila" style="gap:0;border-bottom:1px solid var(--border-soft);min-height:52px">
        <div class="mono xs mut" style="width:64px;flex:none;padding:6px 10px;text-align:right;border-right:1px solid var(--border-soft);align-self:stretch">${h % 12 === 0 ? 12 : h % 12} ${h < 12 ? "AM" : "PM"}</div>
        <div class="crece" style="padding:4px 8px;cursor:pointer" data-act="cal-nueva" data-arg="${iso(CAL.fecha)}T${d2(h)}:00">
          ${enEsta.map(a => html`<button class="ev" style="background:${colorCita(a)};margin-top:2px;padding:5px 8px;font-size:12px" data-act="abrir-cita" data-arg="${a.id}">
            <b>${hora(a.inicio)}–${hora(a.fin)}</b> · ${rotuloCita(a)} · ${nomU(a.vetId)}</button>`)}
        </div>
      </div>`;
      })}
  </div>`;
    }

    function CalLista(citas) {
      const l = lunesDe(CAL.fecha), fin = new Date(l); fin.setDate(fin.getDate() + 7);
      const lista = citas.filter(a => { const s = aFecha(a.inicio); return s >= l && s < fin; }).sort((a, b) => aFecha(a.inicio) - aFecha(b.inicio));
      if (!lista.length) return html`<div class="vacio card"><div class="ico">${icon("calendarioDias")}</div><h3>No hay citas en este rango.</h3></div>`;
      return html`
  <div class="tabla-caja"><table class="tabla">
    <thead><tr><th style="width:170px">Cuándo</th><th>Cita</th><th>Veterinario</th><th style="width:130px">Estado</th></tr></thead>
    <tbody>${lista.map(a => html`
      <tr class="cliqueable" data-act="abrir-cita" data-arg="${a.id}">
        <td class="mono xs mut">${DIAS_C[aFecha(a.inicio).getDay()]} ${d2(aFecha(a.inicio).getDate())} ${MESES_C[aFecha(a.inicio).getMonth()]} · ${hora(a.inicio)}</td>
        <td><span class="fila"><span style="width:10px;height:10px;border-radius:50%;flex:none;background:${colorCita(a)}"></span><span class="semi">${rotuloCita(a)}</span></span></td>
        <td class="mut">${nomU(a.vetId)}</td>
        <td><span class="badge" style="border-color:color-mix(in srgb, ${ESTADO_CITA[a.estado].color} 40%, transparent);color:${ESTADO_CITA[a.estado].color}">${ESTADO_CITA[a.estado].rot}</span></td>
      </tr>`)}</tbody>
  </table></div>`;
    }

    /* El programador: una columna por veterinario, más la de «Sin asignar». Es la vista de quien
       reparte el día. */
    function CalProgramador(citas) {
      const delDia = citas.filter(a => iso(aFecha(a.inicio)) === iso(CAL.fecha));
      const cols = [{ id: null, rot: "Sin asignar" }, ...DB.usuarios.map(u => ({ id: u.id, rot: u.nombre }))];
      const horas = Array.from({ length: 12 }, (_, i) => 7 + i);
      return html`
  <div class="card" style="overflow:auto;max-height:62vh">
    <div style="display:grid;grid-template-columns:58px repeat(${cols.length},minmax(150px,1fr));min-width:${58 + cols.length * 150}px">
      <div class="cab-d" style="border-bottom:1px solid var(--border);background:var(--surface-2)"></div>
      ${cols.map(c => html`<div class="cab-d" style="padding:8px;text-align:center;border-bottom:1px solid var(--border);background:var(--surface-2);font-size:12px;font-weight:600">${c.rot}</div>`)}
      ${horas.map(h => html`
        <div class="hora">${h % 12 === 0 ? 12 : h % 12} ${h < 12 ? "AM" : "PM"}</div>
        ${cols.map(c => {
        const enEsta = delDia.filter(a => (a.vetId || null) === c.id && aFecha(a.inicio).getHours() === h);
        return html`<div class="ranura" data-act="cal-nueva" data-arg="${iso(CAL.fecha)}T${d2(h)}:00">
            ${enEsta.map(a => html`<button class="ev" style="background:${colorCita(a)}" data-act="abrir-cita" data-arg="${a.id}">${hora(a.inicio)} ${rotuloCita(a)}</button>`)}</div>`;
      })}`)}
    </div>
  </div>`;
    }

    /* El cajón de la cita: crear o editar. «Sólo reservar el espacio» apaga paciente y titular —
       es para un almuerzo, un quirófano o una ausencia. */
    function cajonCita(cita, inicioSugerido) {
      const a = cita || {
        id: null, pacienteId: "", ownerId: "", vetId: UI.sesion?.userId || DB.usuarios[0]?.id || "",
        titulo: "", tipo: "consulta_general", estado: "scheduled", bloqueo: false, notas: "",
        inicio: inicioSugerido || dias(0, new Date().getHours() + 1, 0), fin: null, sinHora: false
      };
      const ini = aFecha(a.inicio);
      const fin = a.fin ? aFecha(a.fin) : new Date(ini.getTime() + 30 * 60000);
      const local = d => `${iso(d)}T${d2(d.getHours())}:${d2(d.getMinutes())}`;
      return cajon({
        titulo: a.id ? "Editar cita" : "Nueva cita",
        bajada: "Agendá una cita para un paciente de tu clínica.",
        cuerpo: html`
      <form id="form-cita" class="campo-grupo" data-act="guardar-cita" data-arg="${a.id || ""}">
        <label class="fila panel" style="align-items:flex-start;gap:10px;padding:12px;cursor:pointer">
          <input class="check" type="checkbox" name="bloqueo" ${a.bloqueo ? "checked" : ""} data-act="cita-bloqueo">
          <span><span class="sm semi" style="display:block">Sólo reservar el espacio</span>
            <span class="xs mut" style="display:block;line-height:1.35">Para un almuerzo, un quirófano o una ausencia. Ocupa la agenda del veterinario igual que una cita, pero no lleva paciente ni titular.</span></span>
        </label>
        <div><label class="etiqueta" for="ci">Inicio</label><input class="campo" id="ci" name="inicio" type="datetime-local" value="${local(ini)}" required></div>
        <div><label class="etiqueta" for="cf">Fin</label><input class="campo" id="cf" name="fin" type="datetime-local" value="${local(fin)}" required></div>
        <label class="fila sm mut" style="gap:10px;cursor:pointer"><input class="check" type="checkbox" name="sinHora" ${a.sinHora ? "checked" : ""}> Sin hora definida (ocupa el día entero)</label>
        ${a.bloqueo ? "" : html`
        <div><label class="etiqueta" for="cp">Paciente</label>
          <select class="campo" id="cp" name="pacienteId">
            <option value="">Seleccionar…</option>
            ${DB.pacientes.map(p => html`<option value="${p.id}" ${p.id === a.pacienteId ? "selected" : ""}>${p.nombre} · ${p.especie}</option>`)}
          </select></div>
        <div><label class="etiqueta" for="co">Titular</label>
          <select class="campo" id="co" name="ownerId">
            <option value="">Seleccionar…</option>
            ${DB.titulares.map(o => html`<option value="${o.id}" ${o.id === a.ownerId ? "selected" : ""}>${o.nombre}</option>`)}
          </select><p class="ayuda">Se completa solo al elegir el paciente.</p></div>`}
        <div><label class="etiqueta" for="cv">Veterinario</label>
          <select class="campo" id="cv" name="vetId">
            ${DB.usuarios.map(u => html`<option value="${u.id}" ${u.id === a.vetId ? "selected" : ""}>${u.nombre}</option>`)}
          </select><p class="ayuda">Queda citado en su calendario, como una invitación.</p></div>
        <div><label class="etiqueta" for="ct">Tipo</label>

          <select class="campo" id="ce" name="estado">

          </select></div>

        pie: html`

      ${a.id ? html`<button class="btn borde ancho" data-act="borrar-cita" data-arg="${a.id}">${icon("basura")} Eliminar</button>` : ""}
      <button class="btn fantasma ancho" data-act="cerrar-overlay">Cancelar</button>`
      });
    }

    /* ═══════════════════════════════════════════════════════════════════════════════════════════
       [J15] MODO FANTASMA
    
       El recorrido completo: consentimiento (Ley 1581) → notch con ecualizador y cronómetro →
       panel colgante de 5 pestañas → cockpit a pantalla completa → nota SOAP con la guarda de
       alergia severa → aprobar → facturar lo recetado / informe al titular.
    
       VetGPT escucha en modo fantasma: el titular no interactúa con él.
       ═══════════════════════════════════════════════════════════════════════════════════════════ */
    const ESTADO_CONSULTA = { open: "Abierta", review: "En revisión", completed: "Cerrada", canceled: "Cancelada" };
    const ESTADO_NOTA = { draft: ["Borrador", "neutro"], approved: ["Aprobada", "marca"], locked: ["Bloqueada", "neutro"] };

    const textoPlano = t => String(t || "").replace(/\*\*/g, "").replace(/\[\d+\]/g, "").trim();
    /* Marca lo que el sistema quiere que se lea distinto: negritas, citas numeradas y el lenguaje
       de POSIBILIDAD, que es el que separa una impresión de un diagnóstico cerrado. */
    const POSIBILIDAD = /(compatible con|sugestivo de|sugerente de|no hay evidencia suficiente|evidencia insuficiente|posiblemente|posible|podría|sugiere|se recomienda valorar|sin evidencia)/gi;
    function marcarTexto(t, citas) {
      let s = esc(String(t || ""));
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      /* PARCHE DEMO (ExplainerRAG): *itálica* → <em>, después de negritas y antes de citas. */
      s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
      s = s.replace(/\[(\d+)\]/g, (_, n) => {
        const c = (citas || []).find(x => x.n === Number(n));
        return c && c.url
          ? `<a class="cita" href="${esc(c.url)}" target="_blank" rel="noopener" title="${esc(c.titulo || "")}">[${n}]</a>`
          : `<span class="cita">[${n}]</span>`;
      });
      s = s.replace(POSIBILIDAD, m => `<span class="posib">${m}</span>`);
      return s;
    }
    /* Convierte un texto en bloques: encabezado, viñeta o párrafo. Lo usan el chat, el dock y el
       panel del onboarding, así que vive suelto. */
    function bloquesRicos(texto, citas) {
      const bloques = String(texto || "").split(/\n{2,}|\n(?=\s*(?:[-•*]|\d+\.)\s)/).map(b => b.trim()).filter(Boolean);
      return bloques.map(b => {
        const enc = /^#{1,6}\s/.test(b);
        const vin = !enc && /^\s*(?:[-•*]|\d+\.)\s+/.test(b);
        const t = enc ? b.replace(/^#{1,6}\s+/, "") : vin ? b.replace(/^\s*(?:[-•*]|\d+\.)\s+/, "") : b;
        if (enc) return html`<div class="h">${raw(marcarTexto(t, citas))}</div>`;
        if (vin) return html`<div class="li"><div class="crece">${raw(marcarTexto(t, citas))}</div></div>`;
        return html`<div>${raw(marcarTexto(t, citas))}</div>`;
      });
    }

    const tituloConsulta = c => {
      const n = SEL.notaDe(c.id);
      return c.motivo || (n && (textoPlano(n.a).slice(0, 80) || textoPlano(n.s).slice(0, 80))) || "Consulta";
    };

    function VistaConsultas() {
      const notaF = UI.query.nota ?? FL.consultasNota;
      const q = FL.consultasQ.trim().toLowerCase();
      const asc = FL.consultasOrden === "asc";
      const lista = DB.consultas.filter(c => {
        const n = SEL.notaDe(c.id);
        if (notaF === "sin") { if (n) return false; }
        else if (notaF && (!n || n.estado !== notaF)) return false;
        if (q && !nomP(c.pacienteId).toLowerCase().includes(q)) return false;
        return true;
      });
      const grupos = new Map();
      for (const c of lista) {
        const k = c.pacienteId || "—";
        const g = grupos.get(k) || { id: k, nombre: nomP(c.pacienteId), especie: getP(c.pacienteId)?.especie || "", cs: [], ultima: 0 };
        g.cs.push(c); g.ultima = Math.max(g.ultima, aFecha(c.inicio).getTime());
        grupos.set(k, g);
      }
      const orden = [...grupos.values()].sort((a, b) => asc ? a.ultima - b.ultima : b.ultima - a.ultima);
      for (const g of orden) g.cs.sort((a, b) => asc ? aFecha(a.inicio) - aFecha(b.inicio) : aFecha(b.inicio) - aFecha(a.inicio));
      const filtrando = Boolean(q || notaF);

      return html`
  <div class="pagina">
    <div class="cab-pagina">
      <div>
        <h1 class="fila" style="gap:8px">${icon("fantasma", "faint", 20)} Consultas con VetGPT</h1>

      </div>

      <div class="chips"><span class="rotulo">Nota:</span>
        ${[["", "Todas"], ["draft", "Borrador"], ["approved", "Aprobada"], ["sin", "Sin nota"]].map(([v, t]) => html`
          <button class="chip ${notaF === v ? "act" : ""}" data-act="cons-nota" data-arg="${v}">${t}</button>`)}</div>
      <div class="chips"><span class="rotulo">Fecha:</span>
        <button class="chip ${asc ? "" : "act"}" data-act="cons-orden" data-arg="desc">Más recientes</button>
        <button class="chip ${asc ? "act" : ""}" data-act="cons-orden" data-arg="asc">Más antiguas</button></div>
    </div>

    ${orden.length === 0 ? html`
      <div class="vacio card">
        <div class="ico">${icon(filtrando ? "buscar" : "fantasma")}</div>
        <h3>${filtrando ? "Sin resultados con esos filtros" : "Todavía no hay consultas"}</h3>
        <p>${filtrando ? "Probá con otro nombre de paciente, o quitá los filtros para ver todas las consultas."
            : "Empezá una y VetGPT redactará la nota SOAP al cerrarla, con literatura veterinaria citada."}</p>
        ${filtrando ? html`<button class="btn borde" data-act="cons-nota" data-arg="">Quitar los filtros</button>`
            : html`<button class="btn" data-act="nueva-consulta">Iniciar la primera consulta</button>`}
      </div>` : ""}

    <div class="col" style="gap:12px">
      ${orden.map((g, gi) => html`
        <details class="card" ${filtrando || gi === 0 ? "open" : ""}>
          <summary class="fila" style="padding:12px 16px;cursor:pointer;list-style:none">
            <span class="av" style="border-radius:10px">${g.nombre.charAt(0).toUpperCase()}</span>
            <span class="crece" style="min-width:0">
              ${g.id !== "—"

                : html`<span class="sm b">${g.nombre}</span>`}

            </span>

            ${icon("abajo", "faint", 15)}
          </summary>
          <div style="border-top:1px solid var(--border-soft)">
            ${g.cs.map(c => {
                  const n = SEL.notaDe(c.id);
                  return html`<a class="fila" style="padding:12px 16px;border-bottom:1px solid var(--border-soft)" data-act="ir" data-arg="/dashboard/consultas/${c.id}">
                <span class="mono xs mut" style="width:110px;flex:none">${fecha(c.inicio)}</span>
                <span class="crece trunc sm mut">${tituloConsulta(c)}</span>
                <span class="xs mut" style="flex:none">${ESTADO_CONSULTA[c.estado] || c.estado}</span>
                ${n ? html`<span class="badge ${ESTADO_NOTA[n.estado][1]}">${ESTADO_NOTA[n.estado][0]}</span>` : html`<span class="xs mut">Sin nota</span>`}
                ${icon("der", "marca", 15)}
              </a>`;
                })}
          </div>
        </details>`)}
    </div>
  </div>`;
    }

    /* ── El detalle de la consulta ─────────────────────────────────────────────────────────────
       Si esta consulta es la que se está grabando, la pantalla ENTERA es el cockpit. Si no, es la
       ficha con transcripción, cuaderno, nota SOAP, alertas y referencias. */
    function VistaConsulta(id) {
      const c = getC(id);
      if (!c) return Pantalla404("/dashboard/consultas/" + id);
      if (VIVO.consultaId === id && ["grabando", "subiendo", "transcribiendo"].includes(VIVO.fase)) return Cockpit();

      const p = getP(c.pacienteId);
      const n = SEL.notaDe(id);

      const al = SEL.alergiasDe(c.pacienteId), sev = al.filter(a => a.severidad === "severe");
      const trans = DB.transcripciones[id] || "";
      const turnos = trans ? trans.split("\n").filter(Boolean).map(l => {
        const [quien, ...resto] = l.split(":");
        return { quien: /veterinari/i.test(quien) ? "vet" : "titular", texto: resto.join(":").trim() };
      }) : [];
      const soap = UI.soapEdit[id] || (n ? { s: n.s, o: n.o, a: n.a, p: n.p } : { s: "", o: "", a: "", p: "" });
      const CAMPOS = [["s", "Subjetivo", "Motivo y relato del titular"], ["o", "Objetivo", "Hallazgos del examen físico"],
      ["a", "Análisis", "Impresión — lenguaje de posibilidad"], ["p", "Plan", "Conducta y siguientes pasos"]];
      const banda = {
        alta: ["Evidencia alta", "neutro", null], media: ["Evidencia media", "warn", null],
        baja: ["Evidencia baja", "mal", "Esta nota se apoya en poca literatura: revisala con más cuidado."]

      return html`
  <div class="pagina">

        <div class="crece" style="min-width:0">

            <span class="rotulo" style="letter-spacing:.18em;font-size:10px">Consulta con VetGPT</span></div>

            <a style="text-decoration:underline;text-underline-offset:4px" data-act="ir" data-arg="/dashboard/patients/${c.pacienteId}" title="Abrir la ficha clínica de ${p?.nombre ?? "este paciente"}">${p?.nombre ?? "Consulta"}</a>
          </h1>
          <div class="filaw sm mut" style="gap:16px;margin-top:2px">
            ${p?.especie ? html`<span class="semi" style="color:var(--text)">${p.especie}</span>` : ""}
            <span>${tituloConsulta(c)}</span>
          </div>
        </div>
      </div>
      <div class="filaw" style="margin-top:16px">
        <span class="badge ${aprobada ? "marca" : "neutro"}">${n ? (aprobada ? "Aprobada" : "Borrador — requiere aprobación") : "Sin nota"}</span>
        ${n?.generadaIA ? html`<span class="badge neutro">Redactada por <b style="margin-left:3px">VetGPT</b></span>` : ""}
        ${n ? html`<span class="badge ${banda[1]}">${banda[0]}</span>` : ""}
      </div>
    </div>

    ${(n?.gateAlergia || sev.length) ? html`
      <section class="card pad">
        <p class="rotulo" style="margin-bottom:12px">Alertas de la consulta</p>
        <details open class="card" style="overflow:hidden;border-color:color-mix(in srgb,var(--danger) 40%,transparent)">
          <summary class="fila" style="padding:12px;cursor:pointer;list-style:none;border-left:4px solid var(--danger);background:var(--danger-soft)">
            <span class="av" style="border-radius:10px;background:var(--danger);color:#fff">${icon("alerta", "", 18)}</span>
            <span class="crece">
              <span class="xxs b" style="display:block;text-transform:uppercase;letter-spacing:.06em;color:var(--danger)">Alergia severa · bloqueante</span>
              <span class="b">Alergia severa registrada — revisá antes del plan</span>
            </span>
            ${icon("abajo", "", 15)}
          </summary>
          <div class="pad" style="border-top:1px solid var(--border)">
            <p class="xxs mut" style="text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Fuente: ficha del paciente (determinístico, no del modelo)</p>
            <p class="sm" style="line-height:1.6">
              <span class="badge neutro" style="margin-right:6px">En ${p?.nombre ?? "este paciente"}</span>
              Alergia severa registrada: <b>${sev.map(a => `${a.alergeno}${a.reaccion ? " — " + a.reaccion : ""}`).join("; ")}</b>.
              Evitá ese fármaco y su clase en cualquier plan. Esta alerta <b>bloquea la aprobación</b> de la nota hasta tu revisión.
            </p>
            ${!aprobada ? html`
              <label class="fila sm semi" style="margin-top:12px;cursor:pointer">
                <input class="check" type="checkbox" ${UI.gateOk ? "checked" : ""} data-act="gate">
                Confirmo que revisé el plan considerando esta alergia severa
              </label>` : ""}
          </div>
        </details>
      </section>` : ""}

    <div style="display:grid;gap:18px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start" class="grid-consulta">
      <details class="card" ${UI.capturaAbierta ? "open" : ""}>
        <summary class="entre" style="padding:12px 16px;cursor:pointer;list-style:none">
          <span class="fila sm semi">${icon("ondas", "faint", 15)} Grabación y transcripción de la consulta</span>
          ${icon("abajo", "faint", 15)}
        </summary>
        <div class="pad" style="border-top:1px solid var(--border);display:flex;flex-direction:column;gap:16px">
          ${!aprobada && turnos.length === 0 ? html`
            <div class="filaw entre card pad" style="gap:12px">
              <span class="fila sm">${icon("ondas", "faint", 15)}
                <span>${VIVO.consultaId === id && VIVO.fase === "terminada" ? "Consulta grabada y transcrita." : "Grabá la consulta para que VetGPT redacte la nota."}</span>
                <span class="tip" data-act="tip" data-arg="Antes de grabar se pide el consentimiento del titular (Ley 1581). El audio se transcribe y VetGPT redacta la nota SOAP; el audio se elimina a los 4 días.">?</span></span>
              <button class="btn" data-act="pedir-consentimiento" data-arg="${id}">${icon("micro")} Iniciar grabación</button>
            </div>` : ""}
          ${turnos.length === 0

                  <span class="xxs mut" style="padding:0 4px;text-transform:uppercase;letter-spacing:.06em">${t.quien === "vet" ? "Veterinario" : "Titular"}</span>
                  <div style="max-width:88%;padding:8px 12px;border-radius:16px;font-size:13.5px;${t.quien === "vet" ? "border-bottom-right-radius:4px;background:var(--accent);color:var(--on-brand)" : "border-bottom-left-radius:4px;border:1px solid var(--border);background:var(--surface)"}">${t.texto}</div>
                </div>`)}</div>`}
