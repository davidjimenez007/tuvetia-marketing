      <div class="fila" style="margin-top:28px;gap:12px">
        <button class="btn" data-act="activar-facturacion">Configurar y activar</button>
        <span class="xs mut">Toma ~2 minutos. Empezás en modo de prueba (sandbox).</span>
      </div>
    </div>
  </div>`;
    }

    function VistaVentas() {
      if (!DB.clinica.facturacionActiva) return ModuloInactivo("Ventas");
      const q = FL.ventasQ.trim().toLowerCase();
      let lista = DB.facturas.filter(f => {
        if (FL.ventasEstado && f.estado !== FL.ventasEstado) return false;
        if (FL.ventasTipo && f.doc !== FL.ventasTipo) return false;
        if (!FL.ventasTodo && !esHoy(f.creado)) return false;
        if (q && !((f.numero || "").toLowerCase().includes(q) || nomO(f.ownerId).toLowerCase().includes(q))) return false;
        return true;
      }).sort((a, b) => aFecha(b.creado) - aFecha(a.creado));
      const total = lista.length;
      const ultima = Math.max(1, Math.ceil(total / FL.ventasPorPag));
      FL.ventasPag = Math.min(FL.ventasPag, ultima);
      const pagina = lista.slice((FL.ventasPag - 1) * FL.ventasPorPag, FL.ventasPag * FL.ventasPorPag);
      const sinFacturar = DB.consultas.filter(c => c.estado === "completed" && !DB.facturas.some(f => f.consultaId === c.id)).slice(0, 25);
      const sinEnviar = SEL.emitidas().filter(f => f.entrega === "NO_ENVIADA").length;

      return html`
  <div class="pagina">
    <div class="cab-pagina">
      <div><h1>Ventas, recibos y facturas</h1><p>Documentos · ${mayus1(MESES[HOY.getMonth()])} ${HOY.getFullYear()}</p></div>
      <div class="filaw">${MenuDeVentas()}
        <button class="btn" data-act="nueva-factura">${icon("mas")} Registrar venta</button></div>
    </div>

    ${DB.clinica.sandbox ? html`
      <div class="aviso">${icon("matraz")}<div>Modo sandbox: los documentos no tienen validez fiscal hasta conectar el proveedor DIAN.</div></div>` : ""}

    ${sinFacturar.length || sinEnviar ? html`
      <div class="filaw">
        ${sinFacturar.length ? html`
          <button class="fila xs" style="gap:8px;padding:8px 12px;border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:var(--radius-md);background:var(--card);color:var(--warn);cursor:pointer" data-act="nueva-factura">
            ${icon("esteto", "", 14)}
            ${sinFacturar.length === 1 ? "1 consulta reciente sin facturar" : `${sinFacturar.length} consultas recientes sin facturar`}
            <span class="faint">(${sinFacturar.slice(0, 3).map(c => nomP(c.pacienteId)).join(", ")}${sinFacturar.length > 3 ? "…" : ""})</span>
          </button>` : ""}
        ${sinEnviar ? html`<span class="fila xs mut" style="gap:8px;padding:8px 12px;border:1px solid var(--border-soft);border-radius:var(--radius-md);background:var(--card)">
          ${icon("correoAviso", "", 14)} ${sinEnviar === 1 ? "1 factura emitida sin enviar al cliente" : `${sinEnviar} facturas emitidas sin enviar al cliente`}</span>` : ""}
      </div>` : ""}

    <div class="filaw sm">
      <span class="fila semi" style="gap:6px;padding:6px 12px;border-radius:var(--radius-md);background:var(--accent-soft);color:var(--accent-text)">
        ${icon("calendarioDias", "", 14)} ${FL.ventasTodo ? "Todo el histórico" : "Hoy: " + fecha(HOY)}</span>
      <button class="mut" style="border:0;background:none;cursor:pointer;text-decoration:underline" data-act="ventas-rango">
        ${FL.ventasTodo ? "Volver a hoy" : "Ver todo"}</button>
    </div>

    <div class="filaw" style="gap:8px;align-items:flex-end">
      <label class="col" style="gap:4px"><span class="xxs semi mut">Documento</span>
        <select class="campo" style="height:30px;font-size:12.5px;width:170px" data-act="ventas-tipo">
          <option value="">Todos</option>
          <option value="FACTURA_VENTA" ${FL.ventasTipo === "FACTURA_VENTA" ? "selected" : ""}>Factura electrónica</option>
          <option value="POS" ${FL.ventasTipo === "POS" ? "selected" : ""}>Tiquete POS</option>
        </select></label>
      <label class="col" style="gap:4px"><span class="xxs semi mut">Estado</span>
        <select class="campo" style="height:30px;font-size:12.5px;width:150px" data-act="ventas-estado">
          <option value="">Todos</option>
          ${["BORRADOR", "EMITIDA", "ANULADA"].map(e => html`<option value="${e}" ${FL.ventasEstado === e ? "selected" : ""}>${ROT_CICLO[e]}</option>`)}
        </select></label>
      <div class="buscar" style="width:220px">${icon("buscar")}
        <input class="campo" style="height:30px;font-size:12.5px" value="${FL.ventasQ}" placeholder="Número o cliente" data-act="ventas-buscar"></div>
      ${(FL.ventasQ || FL.ventasEstado || FL.ventasTipo) ? html`<button class="btn fantasma chico" data-act="ventas-limpiar">Limpiar</button>` : ""}
    </div>

    <div class="tabla-caja">
      <div class="entre" style="padding:10px 14px;border-bottom:1px solid var(--border-soft);font-size:12.5px;flex-wrap:wrap">
        <div class="fila mut" style="gap:6px"><span>Mostrar</span>
          ${[10, 25, 50, 100].map(n => html`<button class="${n === FL.ventasPorPag ? "semi" : "mut"}" style="border:0;background:${n === FL.ventasPorPag ? "var(--accent-soft)" : "none"};color:${n === FL.ventasPorPag ? "var(--accent-text)" : "inherit"};border-radius:6px;padding:2px 8px;cursor:pointer" data-act="ventas-npag" data-arg="${n}">${n}</button>`)}
          <span>registros</span></div>
        <span class="mut">${total} ${total === 1 ? "registro" : "registros"}</span>
      </div>
      ${pagina.length === 0 ? html`
        <div class="vacio"><h3>${total === 0 && !q && !FL.ventasEstado ? "Todavía no facturaste nada" : "Ninguna factura con esos filtros"}</h3>
          <p>${total === 0 && !q ? "Se abre lista para cobrar. Si la venta es de un titular, lo atás con «Editar» y seguís."
            : "Probá con otro rango de fechas, o quitá el tipo de documento y el estado."}</p>
          <button class="btn" data-act="nueva-factura">${icon("mas")} Crear la primera factura</button></div>`
          : html`<div style="overflow-x:auto"><table class="tabla">
          <thead><tr><th>Opciones</th><th>Identificación/Cliente</th><th class="n">Valor</th><th class="n">Pagos</th><th>Estado</th><th>Usuario</th><th>Actualizado</th></tr></thead>
          <tbody>${pagina.map(f => html`
            <tr class="cliqueable" data-act="ir" data-arg="/dashboard/facturacion/${f.id}">
              <td class="semi">${f.numero || `Borrador · ${f.doc === "POS" ? "POS" : "FV"}`}</td>
              <td><span class="b" style="display:block">${nomO(f.ownerId)}</span>
                ${getO(f.ownerId)?.doc ? html`<span class="mono xxs faint">${getO(f.ownerId).doc}</span>` : ""}</td>
              <td class="n">${fmtCOP(totalDeFactura(f))}</td>
              <td class="n mut">${f.estado === "EMITIDA" ? fmtCOP(pagadoDeFactura(f)) : "—"}</td>
              <td><span class="filaw" style="gap:4px">${InsigniaCiclo(f)}${InsigniaFiscal(f)}
                ${f.estado === "EMITIDA" ? html`${InsigniaCobro(f)}${InsigniaEntrega(f)}` : ""}</span></td>
              <td class="mut">${nomU(DB.usuarios[0]?.id)}</td>
              <td class="mono xs mut">${fechaHora(f.creado)}</td>
            </tr>`)}</tbody>
        </table></div>`}
      ${total > 0 ? html`
        <div class="entre" style="padding:10px 14px;border-top:1px solid var(--border-soft);font-size:12.5px;color:var(--text-2)">
          <span>Mostrando ${(FL.ventasPag - 1) * FL.ventasPorPag + 1} a ${Math.min(FL.ventasPag * FL.ventasPorPag, total)} de ${total}</span>
          <span class="fila" style="gap:6px">
            <button class="btn borde chico" data-act="ventas-pag" data-arg="-1" ${FL.ventasPag === 1 ? "disabled" : ""}>Anterior</button>
            <button class="btn borde chico" data-act="ventas-pag" data-arg="1" ${FL.ventasPag >= ultima ? "disabled" : ""}>Siguiente</button>
          </span>
        </div>` : ""}
    </div>

    <div class="card pad">
      <div class="entre" style="align-items:flex-start">
        <div><h2 style="font-size:14.5px;font-weight:600">Cobranza automática</h2>
          <p class="xs mut" style="margin-top:2px">Recordatorios de pago — máx. 1 por semana (Ley 2300)</p></div>
        ${DB.clinica.recordatoriosCobro ? html`<span class="badge ok">Activada</span>` : html`<span class="badge neutro">Desactivada</span>`}
      </div>
      <a class="xs semi marca" style="display:inline-block;margin-top:12px" data-act="ir" data-arg="/dashboard/facturacion/configuracion">Gestionar en configuración</a>
    </div>
  </div>`;
    }

    /* El carrito. Las líneas se pliegan para que una cuenta de diez ítems se pueda leer, y el
       total se recalcula desde las mismas funciones que usa el resto de la app. */
    function VistaFacturaNueva() {
      if (!DB.clinica.facturacionActiva) return ModuloInactivo("Nueva venta");
      const f = CARRITO.como();
      const sub = subtotalDeFactura(f), iva = ivaDeFactura(f), tot = totalDeFactura(f);
      const o = getO(CARRITO.ownerId);
      const cob = CARRITO.pacienteId ? DB.planesDePaciente.find(x => x.patientId === CARRITO.pacienteId) : null;
      return html`
  <div class="pagina">
    <a class="volver" data-act="ir" data-arg="/dashboard/facturacion">${icon("flechaIzq")} Ventas</a>
    <div class="cab-pagina"><div><h1>Nueva venta</h1><p>Se abre lista para cobrar. Si la venta es de un titular, atalo acá y seguís.</p></div></div>

    <div class="card pad col" style="gap:16px">
      <div class="filaw" style="gap:12px">

          </select></div>` : ""}
      </div>
      ${cob ? html`<div class="aviso ok">${icon("corazonPulso")}<div>${nomP(CARRITO.pacienteId)} tiene <b>${DB.planesSalud.find(x => x.id === cob.planId)?.nombre}</b>: los servicios incluidos entran en $0 hasta agotar el cupo.</div></div>` : ""}

      <div>
        <label class="etiqueta">Agregar del catálogo</label>

                ${DB.catalogo.filter(i => i.tipo === t && i.activo).map(i => html`<option value="${i.id}">${i.nombre} · ${fmtCOP(i.precio)}${i.ivaEstado === "GRAVADO" ? ` · IVA ${i.iva}%` : " · sin IVA"}</option>`)}
              </optgroup>`)}
          </select>
          <button class="btn borde" data-act="carrito-libre">${icon("mas")} Línea libre</button>
        </div>
      </div>

      ${CARRITO.lineas.length === 0
          ? html`<div class="vacio" style="padding:32px"><p class="sm mut">La cuenta está vacía. Agregá un servicio o producto del catálogo.</p></div>`
          : html`<ul class="col" style="gap:10px">${CARRITO.lineas.map(l => {
            const m = montosDeLinea(l);
            return html`
            <li class="linea-carrito">
              <div class="entre" style="margin-bottom:${l.plegada ? 0 : "12px"}">
                <button class="fila crece" style="border:0;background:none;cursor:pointer;text-align:left;gap:8px" data-act="carrito-plegar" data-arg="${l.key}">
                  <span style="color:var(--muted);transform:rotate(${l.plegada ? -90 : 0}deg)">${icon("abajo", "", 14)}</span>

                  <span class="mono sm">${l.qty} × ${fmtCOP(l.precio)}</span>
                  <span class="mono sm b">${fmtCOP(m.total)}</span>
                </button>
                <button class="acceso" data-act="carrito-quitar" data-arg="${l.key}" aria-label="Quitar la línea">${icon("basura", "", 15)}</button>
              </div>
              ${l.plegada ? "" : html`
                <div class="rejilla-linea">
                  <label class="col" style="gap:4px"><span class="xxs semi mut">Concepto</span>
                    ${l.itemId ? html`<span class="sm" style="padding:6px 0">${l.desc}</span>`
                  : html`<input class="campo" value="${l.desc}" placeholder="Descripción del servicio/producto" data-act="linea" data-arg="${l.key}:desc">`}</label>
                  <label class="col" style="gap:4px"><span class="xxs semi mut">Valor unitario</span>
                    ${l.itemId ? html`<span class="mono sm mut" style="padding:6px 0">${fmtCOP(l.precio)}</span>`

                  <label class="col" style="gap:4px"><span class="xxs semi mut">Descuento</span>

      <div style="display:grid;gap:16px;grid-template-columns:220px 1fr">
        <div><label class="etiqueta" for="dg">Descuento global</label>

      <dl class="totales">

        <div class="t mut"><dt>IVA</dt><dd>${fmtCOP(iva)}</dd></div>
        <div class="t final"><dt>Total</dt><dd>${fmtCOP(tot)}</dd></div>

    const EVENTOS_FACTURA = {
      CREATED: "Borrador creado", ISSUED: "Emitida", FISCAL_VALIDATED: "Validada (CUFE asignado)",
      SENT: "Enviada al cliente", DELIVERED: "Entregada", DELIVERY_FAILED: "Falló la entrega",
      PAYMENT_APPLIED: "Pago aplicado", CREDIT_NOTE_APPLIED: "Nota crédito aplicada", REMINDER_SENT: "Recordatorio enviado"
    };
    function VistaFactura(id) {
      const f = getF(id);
      if (!f) return Pantalla404("/dashboard/facturacion/" + id);
      const o = getO(f.ownerId);
      const sub = subtotalDeFactura(f), iva = ivaDeFactura(f), tot = totalDeFactura(f), saldo = saldoDeFactura(f);
      const linea = [];
      linea.push({ t: "CREATED", at: f.creado });
      if (f.emitido) { linea.push({ t: "ISSUED", at: f.emitido }); linea.push({ t: "FISCAL_VALIDATED", at: f.emitido, d: "CUFE simulado" }); }
      if (f.entrega === "ENVIADA" || f.entrega === "ENTREGADA") linea.push({ t: "SENT", at: f.emitido });
      if (f.entrega === "ENTREGADA") linea.push({ t: "DELIVERED", at: f.emitido });
      if (f.entrega === "FALLIDA") linea.push({ t: "DELIVERY_FAILED", at: f.emitido, d: "El correo rebotó" });
      for (const p of f.pagos) linea.push({ t: "PAYMENT_APPLIED", at: p.fecha, d: `${fmtCOP(p.monto)} · ${p.medio.toLowerCase()}` });
      if (f.notaCredito) linea.push({ t: "CREDIT_NOTE_APPLIED", at: f.notaCredito.fecha, d: `${f.notaCredito.numero} · ${f.notaCredito.motivo}` });
      linea.sort((a, b) => aFecha(a.at) - aFecha(b.at));

      return html`
  <div class="pagina">
    <a class="volver" data-act="ir" data-arg="/dashboard/facturacion">${icon("flechaIzq")} Ventas</a>
    <div class="cab-pagina">
      <div>
        <h1>${f.numero || "Borrador"}</h1>
        <p>${f.doc === "POS" ? "Tiquete POS" : "Factura electrónica de venta"} · creada el ${fechaHora(f.creado)}</p>
        <div class="filaw" style="margin-top:10px">${InsigniaCiclo(f)}${InsigniaFiscal(f)}
          ${f.estado === "EMITIDA" ? html`${InsigniaCobro(f)}${InsigniaEntrega(f)}${InsigniaSeguimiento(f)}` : ""}</div>
      </div>
      <div class="filaw">
        ${f.estado === "BORRADOR" ? html`<button class="btn" data-act="emitir-borrador" data-arg="${f.id}">${icon("recibo")} Emitir</button>` : ""}
        ${f.estado === "EMITIDA" && saldo > 0 ? html`<button class="btn" data-act="registrar-pago" data-arg="${f.id}">${icon("monedas")} Registrar pago</button>` : ""}
        ${f.estado === "EMITIDA" ? html`<button class="btn borde" data-act="enviar-factura" data-arg="${f.id}">${icon("correo")} Enviar al cliente</button>` : ""}
        ${f.estado === "EMITIDA" ? html`<button class="btn borde" data-act="nota-credito" data-arg="${f.id}">Nota crédito</button>` : ""}
        <button class="btn borde" data-act="imprimir">${icon("documento")} Imprimir</button>
      </div>
    </div>

    <div style="display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 300px;align-items:start" class="grid-factura">
      <div class="col" style="gap:20px">
        <section class="card pad sm">
          <p class="rotulo" style="margin-bottom:8px">Cliente</p>
          ${o ? html`<p class="semi" style="color:var(--text)">${o.nombre}</p>
            <p class="mut">${[o.doc, o.email, o.tel].filter(Boolean).join(" · ")}</p>`
          : html`<p class="faint">Sin responsable de pago.</p>`}
        </section>

        <section class="tabla-caja">
          <table class="tabla">
            <thead><tr><th>Descripción</th><th class="n">Cant.</th><th class="n">Precio</th><th class="n">Desc.</th><th class="n">IVA</th><th class="n">Total</th></tr></thead>
            <tbody>${f.lineas.map(l => {
            const m = montosDeLinea(l); return html`
              <tr><td>${l.desc}</td><td class="n mut">${l.qty}</td><td class="n mut">${fmtCOP(l.precio)}</td>
                <td class="n mut">${m.desc > 0 ? "− " + fmtCOP(m.desc) : "—"}</td>
                <td class="n mut">${l.ivaEstado === "GRAVADO" ? l.iva + "%" : l.ivaEstado === "EXENTO" ? "Exento" : "Excl."}</td>
                <td class="n">${fmtCOP(m.total)}</td></tr>`;
          })}</tbody>
            <tfoot>
              <tr><td colspan="5" class="der mut" style="border-top:1px solid var(--border)">Subtotal</td><td class="n" style="border-top:1px solid var(--border)">${fmtCOP(sub)}</td></tr>
              ${descuentoDeFactura(f) > 0 ? html`<tr><td colspan="5" class="der mut">Descuento</td><td class="n mut">− ${fmtCOP(descuentoDeFactura(f))}</td></tr>` : ""}
              <tr><td colspan="5" class="der mut">IVA</td><td class="n">${fmtCOP(iva)}</td></tr>
              <tr style="font-size:16px;font-weight:600"><td colspan="5" class="der">Total</td><td class="n">${fmtCOP(tot)}</td></tr>
              ${f.estado === "EMITIDA" ? html`<tr><td colspan="5" class="der mut">Saldo</td><td class="n">${fmtCOP(saldo)}</td></tr>` : ""}
            </tfoot>
          </table>
        </section>

        ${f.notas ? html`<section class="card pad sm"><p class="rotulo" style="margin-bottom:8px">Observaciones</p>
          <p class="mut" style="white-space:pre-line">${f.notas}</p></section>` : ""}

        ${f.emitido ? html`
          <section class="card pad sm">
            <p class="rotulo" style="margin-bottom:8px">Documento fiscal</p>
            <dl style="display:grid;grid-template-columns:110px 1fr;gap:6px;margin:0">
              <dt class="faint">Proveedor</dt><dd class="mut" style="margin:0">DIAN sandbox (pruebas — sin validez fiscal)</dd>
              <dt class="faint">Estado</dt><dd class="mut" style="margin:0">${ROT_FISCAL[f.fiscal]}</dd>
              <dt class="faint">CUFE</dt><dd class="mono xs mut" style="margin:0;word-break:break-all">${"cufe-simulado-" + (f.numero || "").toLowerCase() + "-4f2a91b0c8e7"}</dd>
            </dl>
          </section>` : ""}

        <section class="card pad">
          <p class="rotulo" style="margin-bottom:12px">Historial</p>
          <ol class="col sm" style="gap:8px">${linea.map(e => html`
            <li class="entre" style="align-items:baseline"><span class="mut">${EVENTOS_FACTURA[e.t]}${e.d ? " · " + e.d : ""}</span>
              <span class="xs faint">${fechaHora(e.at)}</span></li>`)}</ol>
        </section>
      </div>

      <div class="col" style="gap:16px">
        ${f.estado === "BORRADOR" ? html`
          <section class="card pad sm" style="border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--surface-2);color:var(--warn)">
            <p class="fila rotulo" style="gap:8px;margin-bottom:8px;color:inherit">${icon("alerta", "", 14)} Antes de emitir</p>
            <ul class="xs col" style="gap:4px">
              ${o ? "" : html`<li>· Sin cliente: quedará como venta a persona indeterminada.</li>`}
              <li>· El rango en uso es de prueba (sandbox): el documento no tiene validez fiscal.</li>
              ${tot > 500000000 ? html`<li>· Supera el umbral del POS: emitila como factura electrónica.</li>` : ""}
            </ul>
          </section>` : ""}

        ${f.estado === "EMITIDA" ? html`
          <section class="card pad">
            <p class="rotulo" style="margin-bottom:10px">Pagos</p>
            ${f.pagos.length === 0 ? html`<p class="sm mut">Sin pagos registrados.</p>`
            : html`<ul class="col sm" style="gap:8px">${f.pagos.map(p => html`
                <li class="entre"><span>${p.medio.charAt(0) + p.medio.slice(1).toLowerCase()}${p.ref ? ` · ${p.ref}` : ""}</span>
                  <span class="mono">${fmtCOP(p.monto)}</span></li>`)}</ul>`}
            <div class="entre sm semi" style="margin-top:10px;border-top:1px solid var(--border-soft);padding-top:10px">
              <span>Saldo</span><span class="mono">${fmtCOP(saldo)}</span></div>
            ${saldo > 0 ? html`<button class="btn ancho" style="margin-top:12px" data-act="registrar-pago" data-arg="${f.id}">Registrar un pago</button>` : ""}
          </section>` : ""}

        ${f.notaCredito ? html`
          <section class="card pad sm">
            <p class="rotulo" style="margin-bottom:8px">Nota crédito</p>
            <p class="semi">${f.notaCredito.numero}</p>
            <p class="mut">${f.notaCredito.motivo}</p>
            <p class="xs faint" style="margin-top:4px">${fecha(f.notaCredito.fecha)}</p>
          </section>` : ""}

        ${f.consultaId ? html`
          <section class="card pad sm">
            <p class="rotulo" style="margin-bottom:8px">Consulta ligada</p>
            <button class="btn borde chico ancho" data-act="ir" data-arg="/dashboard/consultas/${f.consultaId}">${icon("esteto")} Abrir la consulta</button>
          </section>` : ""}
      </div>
    </div>
  </div>`;
    }

    function VistaCartera() {

      const lista = SEL.porCobrarLista(), ag = SEL.aging();
      const celda = (rot, v, tono) => html`
    <div class="kpi"><p class="l">${rot}</p><p class="v" style="${tono ? "color:var(--warn)" : ""}">${fmtCOP(v)}</p></div>`;
      return html`
  <div class="pagina">
    <a class="volver" data-act="ir" data-arg="/dashboard/facturacion">${icon("flechaIzq")} Ventas</a>
    <div class="cab-pagina">
      <div><h1>Cartera</h1><p>Seguimiento de recaudo bajo la Ley 2300 de 2023.</p></div>

          ? html`<button class="btn borde" data-act="barrido-cartera">${icon("recargar")} Correr el barrido ahora</button>`

          ${celda("Corriente", ag.corriente, false)}${celda("1–30 días", ag.d1_30, true)}

      </section>` : ""}

    <section>

          : html`<div class="col" style="gap:8px">${DB.tareasCartera.map(t => html`
            <div class="filaw card pad" style="gap:12px">
              ${icon("alertaCirculo", "", 16)}
              <span class="crece"><span class="sm semi" style="display:block">${t.titulo}</span>
                <span class="xs mut">${fecha(t.creada)} · ${t.tipo.replaceAll("_", " ").toLowerCase()}</span></span>
              <button class="btn borde chico" data-act="ir" data-arg="/dashboard/facturacion/${t.facturaId}">Abrir la factura</button>
              <button class="btn fantasma chico" data-act="resolver-tarea" data-arg="${t.id}">Marcar resuelta</button>
            </div>`)}</div>`}
    </section>

    <div style="display:grid;gap:24px;grid-template-columns:minmax(0,1fr) 320px" class="grid-cartera">
      <section>
        <h2 class="sm semi" style="margin-bottom:8px">Facturas por cobrar</h2>
        ${lista.length === 0
          ? html`<p class="card" style="padding:32px;text-align:center;font-size:13px;color:var(--muted);border-style:dashed">Sin saldos pendientes. Toda la cartera está al día.</p>`
          : html`<div class="tabla-caja"><table class="tabla">
              <thead><tr><th>Factura</th><th>Cliente</th><th>Vence</th><th class="n">Saldo</th><th>Estado</th><th>Próxima acción</th></tr></thead>
              <tbody>${lista.map(f => {
            const r = DB.recordatorios.find(x => x.facturaId === f.id);
            return html`<tr class="cliqueable" data-act="ir" data-arg="/dashboard/facturacion/${f.id}">
                  <td class="semi">${f.numero || "—"}</td><td class="mut">${nomO(f.ownerId)}</td>
                  <td class="mut">${f.vence ? fecha(f.vence) : "—"}</td>
                  <td class="n semi">${fmtCOP(saldoDeFactura(f))}</td>
                  <td><span class="filaw" style="gap:4px">${InsigniaCobro(f)}${InsigniaSeguimiento(f)}</span></td>

      </section>
    </div>
  </div>`;

      CONSUMO_INTERNO: "Consumo interno", DEVOLUCION: "Devolución", VENCIMIENTO: "Vencimiento", PERDIDA: "Pérdida", AJUSTE: "Ajuste"
    };

        && (!FL.invQ || (i.nombre + " " + (i.sku || "")).toLowerCase().includes(FL.invQ.toLowerCase())));

  <div class="pagina">

      <div class="filaw">

        <button class="btn borde chico" data-act="ir" data-arg="/dashboard/facturacion/inventario/importar">${icon("subir")} Importar <span class="badge neutro xxs">csv</span></button>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><p class="l">Ítems activos</p><p class="v">${r.activos}</p></div>
      <div class="kpi"><p class="l">Valor a costo</p><p class="v">${fmtCOP(r.valorCosto)}</p></div>
      <div class="kpi"><p class="l">Bajo mínimo</p><p class="v" style="${r.bajoMinimo ? "color:var(--warn)" : ""}">${r.bajoMinimo}</p></div>
      <div class="kpi"><p class="l">Agotados</p><p class="v" style="${r.agotados ? "color:var(--warn)" : ""}">${r.agotados}</p></div>
      <div class="kpi"><p class="l">Por vencer</p><p class="v" style="${r.porVencer ? "color:var(--warn)" : ""}">${r.porVencer}</p></div>
    </div>
    <div class="chips">
      <button class="chip ${FL.invCat ? "" : "act"}" data-act="inv-cat" data-arg="">Todas <span style="opacity:.6">${DB.catalogo.length}</span></button>
      ${DB.categorias.map(c => html`<button class="chip ${FL.invCat === c.id ? "act" : ""}" data-act="inv-cat" data-arg="${c.id}">
        ${c.nombre} <span style="opacity:.6">${DB.catalogo.filter(i => i.cat === c.id).length}</span></button>`)}
    </div>
    <div class="buscar" style="max-width:340px">${icon("buscar")}
      <input class="campo" value="${FL.invQ}" placeholder="Buscar por nombre, SKU o código de barras…" data-act="inv-buscar"></div>
    ${r.bajoMinimo || r.agotados ? html`
      <div class="aviso warn">${icon("alerta")}<div>${r.bajoMinimo} ítem(s) por debajo del mínimo y ${r.agotados} agotado(s).</div></div>` : ""}
    <div class="tabla-caja"><table class="tabla">

      <tbody>${items.length === 0 ? html`<tr><td colspan="7" class="centro mut" style="height:80px">Ningún ítem coincide.</td></tr>`
          : items.map(i => {

            return html`<tr>
            <td><span class="semi">${i.nombre}</span><span class="mono xxs faint" style="display:block">${i.sku || ""}</span></td>
            <td class="mut">${TIPO_ITEM[i.tipo]}</td>
            <td class="n" style="${agot ? "color:var(--danger);font-weight:600" : bajo ? "color:var(--warn);font-weight:600" : ""}">${i.stock ? i.unidades : "—"}</td>

            <td>${agot ? html`<span class="badge mal">Agotado</span>` : bajo ? html`<span class="badge warn">Bajo mínimo</span>` : html`<span class="badge ok">En stock</span>`}</td>
          </tr>`;
          })}</tbody>

    function VistaMovimientos() {
      if (!DB.clinica.facturacionActiva) return ModuloInactivo("Salidas y reservas");
      const movs = DB.movimientos.slice().sort((a, b) => aFecha(b.cuando) - aFecha(a.cuando));
      return html`
  <div class="pagina">
    <a class="volver" data-act="ir" data-arg="/dashboard/facturacion/inventario">${icon("flechaIzq")} Existencias</a>

      <div><h1>Salidas y reservas</h1><p>Cada movimiento deja rastro: las existencias son su saldo, no un número que alguien escribe.</p></div>
      <button class="btn" data-act="nuevo-movimiento">${icon("mas")} Registrar movimiento</button>
    </div>
    <div class="tabla-caja"><table class="tabla">
      <thead><tr><th>Cuándo</th><th>Ítem</th><th>Tipo</th><th class="n">Cantidad</th><th>Nota</th></tr></thead>
      <tbody>${movs.map(m => html`<tr>
        <td class="mono xs mut">${fechaHora(m.cuando)}</td>
        <td class="semi">${getItem(m.itemId)?.nombre ?? "—"}</td>
        <td class="mut">${ROT_MOV[m.tipo] || m.tipo}</td>
        <td class="n" style="color:${m.cant < 0 ? "var(--danger)" : "var(--ok)"};font-weight:600">${m.cant > 0 ? "+" : ""}${m.cant}</td>

    /* ── Importar catálogo ──────────────────────────────────────────────────────────────────────
       El archivo se lee de verdad. CSV parseado acá mismo (la maqueta corre sin internet y sin
       librerías), mapeo de columnas propuesto por sinónimos y corregible, previsualización con las
       filas reales, y una importación que deduplica y deja rastro en los movimientos.
       Límites, con todas las letras: XLSX no se parsea (se muestra un fixture con aviso) y foto/OCR
       no existen. Ver NOTAS-MAQUETA.md. */
    const CAMPOS_IMPORT = [["nombre", "Nombre"], ["tipo", "Tipo"], ["precio", "Precio"], ["unidades", "Existencias"], ["min", "Mínimo"], ["sku", "SKU"]];
    const SINONIMOS_IMPORT = {
      nombre: ["nombre", "producto", "descripcion", "item", "articulo", "detalle", "concepto"],
      tipo: ["tipo", "categoria", "clase", "rubro", "familia", "grupo"],
      precio: ["precio", "valor", "pvp", "precioventa", "valorventa", "venta", "preciounitario", "valorunitario"],
      unidades: ["unidades", "cantidad", "existencias", "stock", "saldo", "inventario", "disponible", "cant"],
      min: ["min", "minimo", "stockminimo", "reorden", "puntodereorden", "cantidadminima"],
      sku: ["sku", "codigo", "cod", "referencia", "ref", "codigodebarras", "codbarras", "ean", "plu"]
    };
    /* Lo que se ve cuando llega un .xlsx: columnas típicas de una exportación de caja, con datos de
       ejemplo. No es el archivo del vet y la pantalla lo dice. */
    const FIXTURE_XLSX = {
      encabezados: ["Código", "Descripción", "Categoría", "Precio venta", "Existencias", "Mínimo"],
      filas: [
        ["MED-201", "Meloxicam 1,5 mg/mL", "Medicamento", "62.000", "12", "3"],
        ["MED-202", "Gabapentina 100 mg x 30", "Medicamento", "88.000", "8", "3"],
        ["PRD-301", "Collar isabelino M", "Producto", "24.000", "15", "3"],
        ["PRD-302", "Shampoo clorhexidina 250 mL", "Producto", "46.000", "10", "3"],
        ["INS-401", "Guantes de examen (caja)", "Insumo", "32.000", "20", "5"],
        ["SRV-501", "Ecografía abdominal", "Servicio", "180.000", "", ""]
      ]
    };
    /* Minúsculas, sin tildes, sin espacios ni signos: «Precio venta» y «precio_venta» son lo mismo. */
    const normalizarTexto = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");

    function parsearCSV(texto) {
      const t = String(texto || "").replace(/^﻿/, "");
      /* Delimitador: el que más aparezca en la primera línea fuera de comillas. El CSV que exporta
         Excel en Colombia viene con «;», porque la coma es el separador decimal. */
      const primera = t.split(/\r?\n/)[0] || "";
      let delim = ",", max = -1;
      for (const d of [";", ",", "\t", "|"]) {
        let n = 0, dentro = false;
        for (const ch of primera) { if (ch === '"') dentro = !dentro; else if (ch === d && !dentro) n++; }
        if (n > max) { max = n; delim = d; }
      }
      const filas = []; let fila = [], campo = "", dentro = false;
      const cerrarFila = () => { fila.push(campo); campo = ""; if (fila.some(c => c.trim() !== "")) filas.push(fila); fila = []; };
      for (let i = 0; i < t.length; i++) {
        const ch = t[i];
        if (dentro) {
          if (ch === '"') { if (t[i + 1] === '"') { campo += '"'; i++; } else dentro = false; }
          else campo += ch;
        } else if (ch === '"') dentro = true;
        else if (ch === delim) { fila.push(campo); campo = ""; }
        else if (ch === "\n" || ch === "\r") { if (ch === "\r" && t[i + 1] === "\n") i++; cerrarFila(); }
        else campo += ch;
      }
      if (campo !== "" || fila.length) cerrarFila();
      const encabezados = (filas.shift() || []).map(h => h.trim());
      return { delimitador: delim, encabezados, filas: filas.map(f => encabezados.map((_, i) => (f[i] ?? "").trim())) };
    }

    /* Propone a qué campo va cada columna. Cada campo se asigna una sola vez: gana la primera columna. */
    function proponerMapeo(encabezados) {
      const mapeo = {}, usados = new Set();
      encabezados.forEach((h, i) => {
        const n = normalizarTexto(h);
        const campo = n ? CAMPOS_IMPORT.map(c => c[0]).find(c => !usados.has(c)
          && (n === c || SINONIMOS_IMPORT[c].some(s => n === s || (n.length > 3 && s.length > 3 && (n.startsWith(s) || s.startsWith(n)))))) : null;
        mapeo[i] = campo || "";
        if (campo) usados.add(campo);
      });
      return mapeo;
    }
    /* «62.000», «$ 62.000», «62.000,50», «62000.5» → centavos. Punto de miles o decimal según la forma. */
    function parsearPesos(v) {
      let s = String(v ?? "").trim().replace(/[^\d.,-]/g, "");
      if (!s) return 0;
      const neg = s.startsWith("-"); s = s.replace(/-/g, "");
      if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
      else if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, "");
      else if (/^\d+,\d+$/.test(s)) s = s.replace(",", ".");
      const n = Number(s);
      return Number.isFinite(n) ? Math.round(n * 100) * (neg ? -1 : 1) : 0;
    }
    const parsearEntero = v => { const n = Number(String(v ?? "").replace(/[^\d-]/g, "")); return Number.isFinite(n) ? n : 0; };
    /* El tipo del catálogo a partir de la columna de tipo, y si no viene, de lo obvio en el nombre. */
    function normalizarTipo(v, nombre) {
      const n = normalizarTexto(v);
      if (n) {
        if (/medic|farmac|droga|vacuna|antibiot/.test(n)) return "MEDICAMENTO";
        if (/servi|consulta|procedim|cirug|examen|laborat|ecograf|radiograf|peluquer|bano/.test(n)) return "SERVICIO";
        if (/insumo|material|desechable/.test(n)) return "INSUMO";
        return "PRODUCTO";
      }
      const m = normalizarTexto(nombre);
      if (/\d+mg|mgml|comprim|tablet|capsul|jarabe|vacuna|gotas|solucion/.test(m)) return "MEDICAMENTO";
      if (/guante|jeringa|gasa|venda|algodon/.test(m)) return "INSUMO";
      if (/ecograf|radiograf|consulta|cirug|limpiezadental|peluquer/.test(m)) return "SERVICIO";
      return "PRODUCTO";
    }
    const filasImportadas = () => IMP.fixture ? FIXTURE_XLSX.filas : IMP.filas;
    /* Convierte una fila del archivo, según el mapeo, a lo que necesita el catálogo. */
    function filaAItem(fila) {
      const v = {};
      for (const [i, campo] of Object.entries(IMP.mapeo)) if (campo) v[campo] = fila[Number(i)] ?? "";
      const nombre = String(v.nombre || "").trim();
      if (!nombre) return null;
      const tiene = k => v[k] != null && String(v[k]).trim() !== "";
      return {
        nombre, tipo: normalizarTipo(v.tipo, nombre), sku: String(v.sku || "").trim().toUpperCase() || null,
        precio: parsearPesos(v.precio), unidades: tiene("unidades") ? parsearEntero(v.unidades) : null, min: tiene("min") ? parsearEntero(v.min) : null
      };
    }
    /* Dedupe: por SKU si viene; si no, por nombre normalizado. */
    const itemExistente = f => (f.sku && DB.catalogo.find(i => (i.sku || "").toUpperCase() === f.sku))
      || DB.catalogo.find(i => normalizarTexto(i.nombre) === normalizarTexto(f.nombre)) || null;
    const planImportacion = () => filasImportadas().map(filaAItem).filter(Boolean).map(f => ({ ...f, existente: itemExistente(f) }));

    /* Entrada SÍNCRONA: deja el flujo en el paso 2 con el texto ya parseado. Es lo que usa el replay
       de Remotion (que reconstruye cada frame desde cero y no puede esperar un FileReader) y lo que
       llama cargarArchivoImportado cuando termina de leer el archivo. */
    function importarDesdeTexto(texto, nombreArchivo, tam) {
      const nombre = String(nombreArchivo || "catalogo.csv");
      const ext = (nombre.split(".").pop() || "").toLowerCase();
      IMP.reset();
      IMP.archivo = { nombre, tam: tam ?? String(texto || "").length, ext };
      if (ext === "xlsx" || ext === "xls") {
        IMP.fixture = true; IMP.encabezados = FIXTURE_XLSX.encabezados.slice();
      } else {
        const r = parsearCSV(texto);
        IMP.encabezados = r.encabezados; IMP.filas = r.filas;
        if (!r.encabezados.length || !r.filas.length) IMP.error = "El archivo está vacío o no tiene una fila de encabezados y al menos una de datos.";
      }
      IMP.mapeo = proponerMapeo(IMP.encabezados);
      IMP.paso = IMP.error ? 1 : 2;
      nav("/dashboard/facturacion/inventario/importar");
      return IMP;
    }
    function cargarArchivoImportado(archivo) {
      if (!archivo) return;
      const ext = (archivo.name.split(".").pop() || "").toLowerCase();
      if (ext === "xlsx" || ext === "xls") { importarDesdeTexto("", archivo.name, archivo.size); return; }
      const lector = new FileReader();
      lector.onload = () => {
        const bytes = new Uint8Array(lector.result);
        let texto;
        try { texto = new TextDecoder("utf-8", { fatal: true }).decode(bytes); }
        catch { texto = new TextDecoder("windows-1252").decode(bytes); }   // el CSV «ANSI» que guarda Excel en Windows
        importarDesdeTexto(texto, archivo.name, archivo.size);
      };
      lector.onerror = () => toast("No se pudo leer el archivo", { tono: "mal" });
      lector.readAsArrayBuffer(archivo);
    }
    function confirmarImportacion() {
      if (IMP.fixture) { toast("La maqueta no importa desde Excel. Guarda el archivo como CSV.", { tono: "mal" }); return null; }
      const porDefecto = DB.categorias.find(c => c.pordefecto)?.id || "cat-1";
      const catPara = (tipo, nombre) => tipo === "MEDICAMENTO" ? "cat-2" : tipo === "INSUMO" ? "cat-4"
        : /aliment|croquet|lata|dieta|snack/.test(normalizarTexto(nombre)) ? "cat-3" : porDefecto;
      const nota = `Importación ${IMP.archivo?.nombre || "CSV"}`;
      let creados = 0, actualizados = 0, movimientos = 0;
      for (const f of IMP.filas.map(filaAItem).filter(Boolean)) {
        const ya = itemExistente(f);
        if (ya) {
          /* Existente: precio y existencias se actualizan; el cambio de existencias deja un AJUSTE con
             el delta (una CARGA_INICIAL sobre algo que ya tenía saldo duplicaría el rastro). */
          const antes = ya.unidades || 0;
          if (f.precio) ya.precio = f.precio;
          if (f.min != null) ya.min = f.min;
          if (f.sku && !ya.sku) ya.sku = f.sku;
          if (ya.stock && f.unidades != null && f.unidades !== antes) {
            ya.unidades = f.unidades;
            DB.movimientos.unshift({ id: uid("mv"), itemId: ya.id, tipo: "AJUSTE", cant: f.unidades - antes, cuando: new Date(), nota: `${nota}: de ${antes} a ${f.unidades}` });
            movimientos++;
          }
          actualizados++;
        } else {
          const stock = f.tipo !== "SERVICIO";
          const it = {
            id: uid("it"), tipo: f.tipo, nombre: f.nombre, sku: f.sku, precio: f.precio, iva: 19, ivaEstado: "GRAVADO",
            stock, unidades: stock ? (f.unidades || 0) : 0, min: stock ? (f.min ?? 0) : 0, costo: null, cat: catPara(f.tipo, f.nombre), activo: true,
            duracion: stock ? null : 30
          };
          DB.catalogo.push(it);
          if (stock && it.unidades > 0) {
            DB.movimientos.unshift({ id: uid("mv"), itemId: it.id, tipo: "CARGA_INICIAL", cant: it.unidades, cuando: new Date(), nota });
            movimientos++;
          }
          creados++;
        }
      }
      IMP.reset();
      toast(`Importados: ${creados} ${creados === 1 ? "creado" : "creados"}, ${actualizados} ${actualizados === 1 ? "actualizado" : "actualizados"}`, {
        detalle: movimientos ? `${movimientos} movimiento(s) de existencias registrados.` : "Sin cambios de existencias.",
        accion: { texto: "Ver", act: "ir", arg: "/dashboard/facturacion/inventario" }
      });
      nav("/dashboard/facturacion/inventario");
      return { creados, actualizados, movimientos };
    }

    function VistaImportarCatalogo() {
      const tam = t => t >= 1048576 ? (t / 1048576).toFixed(1) + " MB" : t >= 1024 ? Math.round(t / 1024) + " KB" : (t || 0) + " B";
      const filas = filasImportadas();
      const tieneNombre = Object.values(IMP.mapeo).includes("nombre");
      const plan = IMP.paso === 3 ? planImportacion() : [];
      const nuevos = plan.filter(f => !f.existente).length, repetidos = plan.length - nuevos;
      const avisoXlsx = IMP.fixture ? html`
      <div class="aviso warn">${icon("alerta")}<div><b>La maqueta no lee Excel.</b> Lo que ves es una muestra con columnas y datos de ejemplo, no tu archivo. Guarda el archivo como CSV para importarlo de verdad.</div></div>` : "";
      const archivo = IMP.archivo ? html`
      <div class="fila panel" style="padding:12px"><span class="fila crece">${icon("documento", "faint")} <span class="sm mono">${IMP.archivo.nombre}</span></span>
        <span class="xs mut">${IMP.encabezados.length} columnas · ${filas.length} filas · ${tam(IMP.archivo.tam)}</span></div>` : "";
      return html`
  <div class="pagina angosta">
    <a class="volver" data-act="ir" data-arg="/dashboard/facturacion/inventario">${icon("flechaIzq")} Existencias</a>
    <div class="cab-pagina"><div><h1>Importar catálogo</h1><p>Desde una planilla en CSV. Si la tienes en Excel: Guardar como → CSV.</p></div></div>
    <div class="chips">${[[1, "Archivo"], [2, "Columnas"], [3, "Revisar"]].map(([n, t]) => html`<span class="chip ${IMP.paso === n ? "act" : ""}">${n}. ${t}</span>`)}</div>
    <div class="card pad-lg col" style="gap:16px">
      ${IMP.paso === 1 ? html`
      <label class="vacio" data-soltar="importar">
        <span class="ico">${icon("subir")}</span>
        <b>Arrastra tu archivo acá o haz clic para elegirlo</b>
        <span class="sm mut">El CSV que exporta tu caja o Excel. Con cualquier encabezado: en el paso siguiente VetGPT propone qué columna es qué.</span>
        <input type="file" accept=".csv,text/csv,.xlsx" data-act="imp-archivo" style="display:none">
      </label>
      ${IMP.error ? html`<div class="aviso mal">${icon("alertaCirculo")}<div>${IMP.error}</div></div>` : ""}
      <p class="xs mut">También puedes soltar un .xlsx, pero la maqueta sólo lee CSV: con Excel verás una muestra, no tus datos.</p>`
          : IMP.paso === 2 ? html`
      ${archivo}${avisoXlsx}
      <p class="sm mut">VetGPT propuso a qué campo va cada columna. Corrige lo que no cuadre y sigue.</p>
      <div class="tabla-caja"><table class="tabla">
        <thead><tr><th>Columna del archivo</th><th>Primer valor</th><th>Campo de Tuvetia</th></tr></thead>
        <tbody>${IMP.encabezados.map((h, i) => html`<tr>
          <td class="semi">${h || html`<span class="mut">(sin nombre)</span>`}</td>
          <td class="xs mut">${filas[0]?.[i] ?? ""}</td>
          <td><select class="campo" data-act="imp-mapeo" data-arg="${i}" style="min-width:150px">
            <option value="" ${!IMP.mapeo[i] ? "selected" : ""}>No importar</option>
            ${CAMPOS_IMPORT.map(([c, rot]) => html`<option value="${c}" ${IMP.mapeo[i] === c ? "selected" : ""}>${rot}</option>`)}
          </select></td></tr>`)}</tbody>
      </table></div>
      ${tieneNombre ? "" : html`<div class="aviso">${icon("alertaCirculo")}<div>Falta decir qué columna es el <b>Nombre</b>: sin eso no hay qué importar.</div></div>`}
      <div class="filaw">

    const ROT_EGRESO = { ARRIENDO: "Arriendo", NOMINA: "Nómina", INVENTARIO: "Inventario", SERVICIOS: "Servicios públicos", IMPUESTOS: "Impuestos", OTROS: "Otros" };
    function VistaFinanzas() {
      if (!DB.clinica.facturacionActiva) return ModuloInactivo("Ingresos y egresos");
      const pagosMes = SEL.emitidas().flatMap(f => f.pagos).filter(p => enMes(p.fecha));
      const ingresos = pagosMes.reduce((s, p) => s + p.monto, 0);
      const egresosMes = DB.egresos.filter(e => enMes(e.fecha));
      const egresos = egresosMes.reduce((s, e) => s + e.monto, 0);
      /* Seis meses de barras: ingresos contra egresos, que es la pregunta que se hace quien abre
         esta pantalla. */
      const meses = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(HOY.getFullYear(), HOY.getMonth() - i, 1);
        const enEse = x => { const y = aFecha(x); return y.getFullYear() === d.getFullYear() && y.getMonth() === d.getMonth(); };
        meses.push({
          rot: MESES_C[d.getMonth()],
          ing: SEL.emitidas().flatMap(f => f.pagos).filter(p => enEse(p.fecha)).reduce((s, p) => s + p.monto, 0),
          egr: DB.egresos.filter(e => enEse(e.fecha)).reduce((s, e) => s + e.monto, 0)
        });
      }
      const max = Math.max(1, ...meses.flatMap(m => [m.ing, m.egr]));
      const items = [
        ...pagosMes.map(p => ({ tipo: "INGRESO", fecha: p.fecha, concepto: p.ref || "Pago recibido", medio: p.medio, monto: p.monto })),
        ...egresosMes.map(e => ({ tipo: "EGRESO", fecha: e.fecha, concepto: e.nota || ROT_EGRESO[e.categoria], medio: e.medio, monto: e.monto, cat: e.categoria }))
      ].sort((a, b) => aFecha(b.fecha) - aFecha(a.fecha));

      return html`
  <div class="pagina">
    <a class="volver" data-act="ir" data-arg="/dashboard/facturacion">${icon("flechaIzq")} Ventas</a>
    <div class="cab-pagina">
      <div><h1 class="fila" style="gap:8px">${icon("cartera", "faint", 22)} Ingresos y egresos</h1>
        <p>Lo que entró y lo que salió este mes. Los ingresos son PAGOS recibidos, no facturas emitidas.</p></div>
      <div class="filaw"><button class="btn borde" data-act="nuevo-ingreso">${icon("mas")} Ingreso</button>
        <button class="btn" data-act="nuevo-egreso">${icon("mas")} Egreso</button></div>
    </div>
    <div class="kpis">
      <div class="kpi"><p class="l">Ingresos del mes</p><p class="v" style="color:var(--ok)">${fmtCOP(ingresos)}</p></div>
      <div class="kpi"><p class="l">Egresos del mes</p><p class="v" style="color:var(--danger)">${fmtCOP(egresos)}</p></div>
      <div class="kpi"><p class="l">Resultado</p><p class="v" style="color:${ingresos - egresos >= 0 ? "var(--ok)" : "var(--danger)"}">${fmtCOP(ingresos - egresos)}</p></div>
      <div class="kpi"><p class="l">Por cobrar</p><p class="v">${fmtCOP(SEL.porCobrar())}</p></div>
    </div>
    <div class="bloque">
      <div class="tit">${icon("actividad", "", 16)}<span>Últimos 6 meses</span></div>
      <div class="baja">Barra menta: ingresos. Barra roja: egresos.</div>
      <svg viewBox="0 0 700 200" width="100%" height="200" role="img" aria-label="Ingresos contra egresos por mes">
        ${meses.map((m, i) => {
        const x = 40 + i * 108, hi = m.ing / max * 140, he = m.egr / max * 140;
        return html`<g>
            <rect x="${x}" y="${160 - hi}" width="36" height="${hi}" rx="4" fill="var(--chart-1)"><title>${m.rot}: ingresos ${fmtCOP(m.ing)}</title></rect>
            <rect x="${x + 40}" y="${160 - he}" width="36" height="${he}" rx="4" fill="var(--chart-4)"><title>${m.rot}: egresos ${fmtCOP(m.egr)}</title></rect>
            <text x="${x + 38}" y="180" text-anchor="middle" font-size="11" fill="var(--muted)">${m.rot}</text></g>`;
      })}
        <line x1="30" y1="160" x2="680" y2="160" stroke="var(--border)"/>
      </svg>
    </div>
    <div class="tabla-caja"><table class="tabla">
      <thead><tr><th>Fecha</th><th>Concepto</th><th>Tipo</th><th>Medio</th><th class="n">Monto</th></tr></thead>
      <tbody>${items.length === 0 ? html`<tr><td colspan="5" class="centro mut" style="height:80px">Sin movimientos este mes.</td></tr>`
          : items.map(i => html`<tr>
          <td class="mono xs mut">${fecha(i.fecha)}</td><td class="semi">${i.concepto}</td>
          <td>${i.tipo === "INGRESO" ? html`<span class="badge ok">Ingreso</span>` : html`<span class="badge mal">${ROT_EGRESO[i.cat] || "Egreso"}</span>`}</td>
          <td class="mut">${i.medio.charAt(0) + i.medio.slice(1).toLowerCase()}</td>
          <td class="n" style="color:${i.tipo === "INGRESO" ? "var(--ok)" : "var(--danger)"}">${i.tipo === "INGRESO" ? "+" : "−"} ${fmtCOP(i.monto)}</td></tr>`)}</tbody>
    </table></div>
  </div>`;
    }

    /* Un QR de mentira pero con la forma correcta: los tres ojos y un patrón estable. */
    function QRFalso() {
      const r = rngCon(4242);
      const celdas = [];
      for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
        const ojo = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
        if (ojo) continue;
        if (r() > 0.52) celdas.push(html`<rect x="${x * 6}" y="${y * 6}" width="6" height="6"/>`);
      }
      const ojo = (x, y) => html`<rect x="${x}" y="${y}" width="42" height="42"/><rect x="${x + 6}" y="${y + 6}" width="30" height="30" fill="var(--surface)"/><rect x="${x + 12}" y="${y + 12}" width="18" height="18"/>`;
      return html`<svg viewBox="0 0 126 126" width="168" height="168" fill="var(--text)" role="img" aria-label="Código QR para vincular WhatsApp">
    <rect width="126" height="126" fill="var(--surface)"/>${celdas}${ojo(0, 0)}${ojo(84, 0)}${ojo(0, 84)}</svg>`;
    }

      ${accion || ""}

        c.plan === "pro" ? "" : html`<p class="ayuda" style="margin-top:16px">Es lo que tenés hoy. Nada de esto caduca.</p>`)}
      ${columna("Pro", html`${fmtCOP(24900000)}<span class="sm mut" style="font-weight:400"> /mes</span>`, INCLUYE_PRO, c.plan === "pro",
          c.plan === "pro" ? "" : html`<button class="btn ancho" style="margin-top:16px" data-act="subir-pro">Subir a Pro</button>`)}
    </div>

    ${c.plan === "pro" ? html`
      <div class="card pad">
        <h3 class="sm b">Tu suscripción</h3>
        <dl style="display:grid;grid-template-columns:auto 1fr;gap:6px 24px;margin-top:12px;font-size:13.5px">

          <dt class="mut">Se renueva</dt><dd class="semi" style="margin:0">${fecha(c.renuevaEn)}</dd>
          <dt class="mut">Medio de pago</dt><dd class="semi" style="margin:0">${c.tarjeta ? html`<span class="mono">${c.tarjeta.marca} ···· ${c.tarjeta.ultimos4}</span>` : "Sin tarjeta — cortesía de Tuvetia"}</dd>

        <div class="tabla-caja" style="margin-top:12px;border:0">
          <table class="tabla">
            <thead><tr><th>Fecha</th><th>Concepto</th><th>Período</th><th class="n">Monto</th><th class="der">Estado</th></tr></thead>
            <tbody>${[0, 1, 2].map(i => {
            const d = new Date(HOY.getFullYear(), HOY.getMonth() - i, 11);
            return html`<tr><td class="mut">${fecha(d)}</td><td>${i === 2 ? "Primer pago" : "Renovación"}</td>
                <td class="mut">${fecha(d)} — ${fecha(new Date(d.getFullYear(), d.getMonth() + 1, 10))}</td>
                <td class="n mono">${fmtCOP(24900000)}</td><td class="der">Pagado</td></tr>`;

            const v = veredicto(c);
            return html`<tr>
            <td class="mono semi">${c.codigo}</td>
            <td>${v === "activo" ? html`<span class="badge ok">activo</span>` : html`<span class="badge neutro">${v}</span>`}</td>
            <td class="n">${c.dias}</td><td class="n mono">${c.usos} / ${c.maxUsos}</td>
            <td class="mut">${c.expira || "—"}</td>

    /* ═══════════════════════════════════════════════════════════════════════════════════════════
       [J24] REGISTRO DE ACCIONES
    
       Un solo listener en `document` y una tabla de acciones. Cada control declara
       `data-act="loQueHace"` y, si necesita, `data-arg`. No hay un solo addEventListener por
       botón: repintar la pantalla entera no deja huérfano ningún manejador.
       ═══════════════════════════════════════════════════════════════════════════════════════════ */
    const val = el => el.value;
    const num = el => Number(String(el.value).replace(/\D/g, "")) || 0;
    function datosForm(el) {
      const form = el.closest("form") || el;
      const o = {};
      for (const c of form.querySelectorAll("input,select,textarea")) {
        if (!c.name) continue;
        o[c.name] = c.type === "checkbox" ? c.checked : c.value;
      }
      return o;
    }
    function entrarComo(sesion) { UI.sesion = sesion; cerrarTodo(); }

      /* ── Navegación y shell ─────────────────────────────────────────────────────────────── */

      "ir-cerrar": a => { cerrarOverlay(); nav(a); },
      "alternar-barra": () => { UI.barraChica = !UI.barraChica; document.body.classList.toggle("barra-chica", UI.barraChica); },
      "barra-movil": () => { UI.barraMovil = !UI.barraMovil; document.body.classList.toggle("barra-movil", UI.barraMovil); render(); },
      tema: () => { setTema(UI.tema === "oscuro" ? "claro" : "oscuro"); render(); },

      "cerrar-overlay": () => cerrarOverlay(),

        if (!fila) { ACC.errorPuerta = "Ese código no existe. Revisá que esté completo y sin espacios."; render(); return; }

        if (fila.expira && new Date(fila.expira) <= new Date()) { ACC.errorPuerta = "Ese código venció. Pedile uno nuevo a quien te lo compartió."; render(); return; }
        if (fila.usos >= fila.maxUsos) { ACC.errorPuerta = "Ese código ya se usó todas las veces disponibles."; render(); return; }

    /* Helpers de las acciones */
    function mover(lista, id, delta) {
      const i = lista.findIndex(x => x.id === id), j = i + delta;
      if (i < 0 || j < 0 || j >= lista.length) return;
      [lista[i], lista[j]] = [lista[j], lista[i]];
    }
    function abrirPersonalizarOtraVez() { cerrarOverlay(); abrirPersonalizar(); }
    /* Repinta la vista sin perder el foco del campo que la disparó: es lo que permite escribir
       en un buscador y ver la lista filtrarse letra a letra. */
    function repintarLista() {
      const el = document.activeElement;
      const sel = el && el.dataset && el.dataset.act;
      const pos = el && el.selectionStart;
      render();
      if (sel) {
        const nuevo = document.querySelector(`[data-act="${sel}"]`);
        if (nuevo) { nuevo.focus(); try { nuevo.setSelectionRange(pos, pos); } catch { } }
      }
    }
    function repintarTotales() {
      const caja = document.querySelector(".totales");
      if (!caja) return;
      const f = CARRITO.como();
      caja.innerHTML = String(html`
    <div class="t mut"><dt>Subtotal</dt><dd>${fmtCOP(subtotalDeFactura(f))}</dd></div>
    ${descuentoDeFactura(f) > 0 ? html`<div class="t mut"><dt>Descuento</dt><dd>− ${fmtCOP(descuentoDeFactura(f))}</dd></div>` : ""}
    <div class="t mut"><dt>IVA</dt><dd>${fmtCOP(ivaDeFactura(f))}</dd></div>
    <div class="t final"><dt>Total</dt><dd>${fmtCOP(totalDeFactura(f))}</dd></div>`);
    }
    function leerFormCita(el) {
      const d = datosForm(el);
      return {
        id: null, pacienteId: d.pacienteId, ownerId: d.ownerId, vetId: d.vetId, titulo: d.titulo,
        tipo: d.tipo, estado: d.estado, notas: d.notas, inicio: new Date(d.inicio), fin: new Date(d.fin), sinHora: !!d.sinHora
      };
    }
    /* Al emitir, el stock de lo vendido baja: la existencia es el saldo de los movimientos, y una
       venta ES un movimiento. */
    function descontarStock(f) {
      for (const l of f.lineas) {
        const it = getItem(l.itemId);
        if (it && it.stock) {
          it.unidades = Math.max(0, it.unidades - l.qty);
          DB.movimientos.unshift({ id: uid("mv"), itemId: it.id, tipo: "SALIDA_VENTA", cant: -l.qty, cuando: new Date(), nota: `Factura ${f.numero || "borrador"}` });
        }
      }
    }
    function crearFactura(estado) {
      if (CARRITO.descGlobal > 0 && !CARRITO.razon.trim()) { toast("El descuento global necesita una razón escrita.", { tono: "mal" }); return; }
      const emitida = estado === "EMITIDA";
      const f = {
        id: uid("f"), numero: emitida ? "FV-" + (1100 + DB.facturas.filter(x => x.numero).length) : null,
        doc: "FACTURA_VENTA", estado, fiscal: emitida ? "VALIDADA" : "BORRADOR",
        entrega: "NO_ENVIADA", seguimiento: "NO_REQUERIDO",
        ownerId: CARRITO.ownerId, pacienteId: CARRITO.pacienteId, consultaId: CARRITO.consultaId,
        creado: new Date(), emitido: emitida ? new Date() : null, vence: emitida ? dias(15) : null,
        lineas: CARRITO.lineas.map(l => ({ itemId: l.itemId, desc: l.desc, qty: l.qty, precio: l.precio, descPct: l.descPct, iva: l.iva, ivaEstado: l.ivaEstado })),
        pagos: [], notas: CARRITO.notas, descGlobal: CARRITO.descGlobal
      };
      DB.facturas.unshift(f);
      if (emitida) descontarStock(f);
      CARRITO.reset(null);
      toast(emitida ? `${f.numero} emitida por ${fmtCOP(totalDeFactura(f))}` : "Borrador guardado",
        { detalle: emitida ? "Ya se ve en el tablero, en la dona de ventas y en la cartera." : null });
      nav("/dashboard/facturacion/" + f.id);
    }

    /* La tarjeta del panel de VetGPT en el onboarding hace una pausa de «escribiendo…» al cambiar
       de paso: sin ella el texto salta y no se lee como una conversación. */
    function tarjetaDePaso() {
      WZ.escribiendo = true; render();
      SIM.after("view", 600, () => { WZ.escribiendo = false; render(); });
    }

    /* ── El único listener ────────────────────────────────────────────────────────────────────
       Tres eventos, una tabla. Los campos de texto van por `input` y los que tienen estado
       discreto (casillas, selects, fechas) por `change`: si los dos escucharan lo mismo, cada
       tecla dispararía dos veces. */
    function correr(nombre, arg, ev, el) {
      const fn = ACTIONS[nombre];
      if (!fn) { console.warn("Acción sin manejador:", nombre); return; }
      try { fn(arg, ev, el); }
      catch (err) { console.error("La acción «" + nombre + "» falló:", err); toast("Algo se rompió al hacer eso", { tono: "mal", detalle: String(err && err.message || err) }); }
    }
    document.addEventListener("click", ev => {
      const el = ev.target.closest("[data-act]");
      if (!el) return;
      if (el.matches("input,select,textarea")) return;      // ésos van por input/change
      if (el.tagName === "BUTTON" && el.type === "submit" && el.form) return;  // lo maneja el submit
      correr(el.dataset.act, el.dataset.arg, ev, el);
    });
    document.addEventListener("submit", ev => {
      const el = ev.target.closest("[data-act]");
      if (!el) { ev.preventDefault(); return; }
      correr(el.dataset.act, el.dataset.arg, ev, el);
    });
    document.addEventListener("input", ev => {
      const el = ev.target.closest("[data-act]");
      if (!el || !el.matches("input,textarea")) return;
      if (el.type === "checkbox" || el.type === "radio" || el.type === "date" || el.type === "time" || el.type === "datetime-local") return;
      correr(el.dataset.act, el.dataset.arg, ev, el);
    });
    document.addEventListener("change", ev => {
      const el = ev.target.closest("[data-act]");
      if (!el) return;
      if (el.tagName === "SELECT" || el.type === "checkbox" || el.type === "radio" || el.type === "date" || el.type === "time" || el.type === "datetime-local")
        correr(el.dataset.act, el.dataset.arg, ev, el);
    });
    /* Arrastrar un archivo a la zona de importar. Viven en document, como los demás: render()
       regenera el HTML y un listener puesto en el elemento moriría con él. */
    document.addEventListener("dragover", ev => {
      const zona = ev.target.closest?.("[data-soltar]");
      if (!zona) return;
      ev.preventDefault(); zona.classList.add("sobre");
    });
    document.addEventListener("dragleave", ev => { ev.target.closest?.("[data-soltar]")?.classList.remove("sobre"); });
    document.addEventListener("drop", ev => {
      const zona = ev.target.closest?.("[data-soltar]");
      if (!zona) return;
      ev.preventDefault(); zona.classList.remove("sobre");
      const archivo = ev.dataTransfer?.files?.[0];
      if (archivo) cargarArchivoImportado(archivo);
    });
    /* Enter envía en el compositor; Shift+Enter hace salto de línea. Es lo que espera cualquiera
       que haya usado un chat. */
    document.addEventListener("keydown", ev => {
      if (ev.key === "Escape") {
        if (OV.pila.length) { cerrarOverlay(); return; }
        if (VIVO.consultaId && UI.ruta === `/dashboard/consultas/${VIVO.consultaId}` && VIVO.fase === "grabando") { nav("/dashboard/consultas"); return; }
        if (VIVO.panelAbierto) { VIVO.panelAbierto = false; renderFlotantes(); }
        return;
      }
      if (ev.key === "Enter" && !ev.shiftKey && ev.target.matches("textarea[name=q]")) {
        ev.preventDefault();
        const form = ev.target.closest("form");
        if (form) form.requestSubmit ? form.requestSubmit() : correr(form.dataset.act, form.dataset.arg, new Event("submit"), form);
      }
    });
    /* El notch se arrastra. Se acota a la ventana para que no se pueda perder fuera de la
       pantalla, y queda donde lo dejaron. */
    document.addEventListener("pointerdown", ev => {
      const asa = ev.target.closest('[data-act="notch-arrastrar"]');
      if (!asa) return;
      ev.preventDefault();
      const caja = asa.closest(".notch-caja");
      const inicio = { x: ev.clientX, y: ev.clientY, dx: VIVO.arrastre.x, dy: VIVO.arrastre.y };
      const mover2 = e2 => {
        const limX = Math.max(0, (innerWidth - caja.offsetWidth) / 2 - 8);
        const limY = Math.max(0, innerHeight - caja.offsetHeight - 120);
        VIVO.arrastre = {
          x: Math.max(-limX, Math.min(limX, inicio.dx + e2.clientX - inicio.x)),
          y: Math.max(0, Math.min(limY, inicio.dy + e2.clientY - inicio.y))
        };
        caja.style.transform = `translate(calc(-50% + ${VIVO.arrastre.x}px), ${VIVO.arrastre.y}px)`;
      };
      const soltar = () => { removeEventListener("pointermove", mover2); removeEventListener("pointerup", soltar); renderFlotantes(); };
      addEventListener("pointermove", mover2);
      addEventListener("pointerup", soltar);
    });
    /* PARCHE DEMO: sin hashchange — nav() ya pinta síncrono. */

    window.app = {
      /* DB y WZ van por getter y no por valor: `seedDemo`, `seedEmpty` y `resetWZ` REASIGNAN esas
         variables, así que una copia tomada al arrancar quedaría apuntando a un objeto muerto —
         y desde la consola parecería que nada cambia. Los demás nunca se reasignan. */
      get DB() { return DB; },
      get WZ() { return WZ; },
      UI, SEL, CHAT, VIVO, CARRITO, CAL, COM, FL, ACC, ROUTES, ACTIONS, SIM,
      render, nav, toast, setTema, renderFlotantes, seedDemo, seedEmpty, resetWZ,

      reseed() { window.__resetAzar(); __uidN = 0; },

      responderVetGPT, repintarChat, REPREGUNTAS,
      /* PARCHE DEMO (videos de producto): una tarjeta empujada desde consola se registra en
         ACCIONES_VIVAS para poder aprobarla; la importación tiene entrada síncrona (sin FileReader). */
      ACCIONES_VIVAS, IMP, importarDesdeTexto, cargarArchivoImportado, confirmarImportacion,

      /* Recorre todas las rutas y avisa si alguna se rompe. Además busca artefactos: un
         «[object Object]» o un «undefined» impreso no lanza excepción, así que sin este chequeo
         pasan desapercibidos hasta que alguien mira la pantalla. */
      smoke() {
        const ARTEFACTOS = [/Algo se rompió al pintar/, /\[object Object\]/, /\bundefined\b/, /\bNaN\b/, /\bnull\b/];
        const antes = { hash: location.hash, sesion: UI.sesion };
        const errores = [];
        let ok = 0;
        const probar = (ruta, sesion) => {
          UI.sesion = sesion;
          try { history.replaceState(null, "", "#" + ruta); } catch { location.hash = "#" + ruta; }
          try { render(); } catch (e) { errores.push(`${ruta} → excepción: ${e.message}`); return; }
          const txt = document.getElementById("app").innerText || "";
          const art = ARTEFACTOS.find(re => re.test(txt));
          if (art) errores.push(`${ruta} → artefacto ${art}`);
          else ok++;
        };
        const clinica = { userId: "u-1", tipo: "clinica", rol: "admin" };
        const plataforma = { userId: null, tipo: "plataforma", rol: "platform_admin" };
        for (const r of ROUTES) {
          if (r.p.includes(":")) continue;
          probar(r.p, r.capa === "plataforma" ? plataforma : r.capa === "acceso" ? null : clinica);
        }
        for (const d of [`/dashboard/patients/${DB.pacientes[0].id}`, `/dashboard/owners/${DB.titulares[0].id}`,
        `/dashboard/consultas/${DB.consultas[0].id}`, `/dashboard/facturacion/${DB.facturas[0].id}`])
          probar(d, clinica);
        UI.sesion = antes.sesion;
        try { history.replaceState(null, "", antes.hash); } catch { location.hash = antes.hash; }
        render();
        console.log(errores.length ? "%c✗ " + errores.length + " problema(s)" : "%c✓ " + ok + " rutas OK", `color:${errores.length ? "#c03a2e" : "#12856a"};font-weight:700`);
        errores.forEach(e => console.log("  · " + e));
        return { ok, errores };
      }
    };
    console.log("%cTuvetia — la app entera en un archivo", "font:600 14px system-ui;color:#12856a");
    console.log("Probá: app.smoke() · app.DB · app.nav('/dashboard/tablero') · app.enviarChat('¿qué citas hay hoy?')");
  </script>
